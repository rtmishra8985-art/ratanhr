<nav class="topnav">
  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-sm d-md-none" onclick="document.getElementById('sidebar').classList.toggle('show')"><i class="bi bi-list fs-5"></i></button>
    <h6 class="mb-0 fw-semibold">Upload Company Logo</h6>
  </div>
  <div class="d-flex align-items-center gap-3">
    <div class="avatar-circle" id="navAvatar">?</div>
    <button class="btn btn-sm btn-danger px-3" onclick="logout()">Logout</button>
  </div>
</nav>
<div class="main-panel">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card card-table">
        <div class="card-header py-3">Upload Logo</div>
        <div class="card-body">
          <!-- BACKEND: POST /upload-logo, enctype multipart -->
          <!-- <div class="alert alert-success">Logo uploaded successfully!</div> -->
          <form action="/upload-logo" method="POST" enctype="multipart/form-data">
            <div class="mb-4">
              <label class="form-label fw-semibold small">Current Logo</label>
              <div class="text-center p-3 border rounded">
                <!-- BACKEND: <img src="/uploadLogo/{{current_logo}}" alt="Logo" style="max-height:80px;"> -->
                <img src="assets/img/ratanhr-logo.png" alt="Current Logo" style="max-height:80px;" onerror="this.style.display='none'; document.getElementById('noLogo').style.display='block'">
                <div id="noLogo" class="text-muted small" style="display:none;">No logo uploaded yet</div>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold small">New Logo File <span class="text-danger">*</span></label>
              <div class="dropzone" onclick="document.getElementById('logoFile').click()">
                <i class="bi bi-image text-warning" style="font-size:48px;"></i>
                <p class="mt-2 mb-1 fw-semibold">Click to upload logo</p>
                <small class="text-muted">PNG, JPG, SVG recommended</small>
                <input type="file" id="logoFile" name="logoFile" accept="image/*" required style="display:none;"
                  onchange="previewLogo(this)">
              </div>
              <div class="mt-2 text-center" id="previewContainer" style="display:none;">
                <img id="logoPreview" src="" alt="Preview" style="max-height:80px; border-radius:8px;">
                <p class="small text-muted mt-1" id="logoFileName"></p>
              </div>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-warning fw-bold">
                <i class="bi bi-cloud-upload me-2"></i>Upload Logo
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script>
function previewLogo(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById('logoPreview').src = e.target.result;
      document.getElementById('logoFileName').textContent = input.files[0].name;
      document.getElementById('previewContainer').style.display = 'block';
    };
    reader.readAsDataURL(input.files[0]);
  }
}
</script>
</body>
</html>
