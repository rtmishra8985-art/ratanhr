<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <title>Super Admin Login – RatanHR</title>
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/hrms.css" rel="stylesheet">

  <!-- Theme system -->
  <link rel="stylesheet" href="/css/theme.css">
  <script src="/js/theme.js"></script>
</head>
<body>
<div class="login-wrapper super">
  <div class="login-card card">
    <div class="card-body">
      <div class="text-center mb-4">
        <div class="mb-2" style="font-size:44px;">👑</div>
        <span class="badge bg-purple text-white mb-2 px-3 py-2" style="background:#9b59b6!important;font-size:13px;">SUPER ADMIN</span>
        <h4 class="fw-bold mt-2">System Control Panel</h4>
        <p class="text-muted small">Full system access · RatanHR</p>
      </div>

      <!-- BACKEND: Show error here -->
      <!-- <div class="alert alert-danger">{{error_message}}</div> -->

      <form action="/superadmin-login" method="POST">
        <div class="mb-3">
          <label class="form-label fw-semibold small">Super Admin Email</label>
          <div class="input-group">
            <span class="input-group-text" style="background:#f3e5f5;"><i class="bi bi-shield-lock" style="color:#9b59b6;"></i></span>
            <input type="email" class="form-control" name="email" placeholder="superadmin@company.com" required>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold small">Password</label>
          <div class="input-group">
            <span class="input-group-text" style="background:#f3e5f5;"><i class="bi bi-key" style="color:#9b59b6;"></i></span>
            <input type="password" class="form-control" name="password" placeholder="Enter password" required id="saPass">
            <button class="btn btn-outline-secondary" type="button" onclick="togglePass('saPass','saEye')"><i class="bi bi-eye" id="saEye"></i></button>
          </div>
        </div>
        <div class="d-grid mb-3">
          <button type="submit" class="btn btn-login btn-login-super btn-lg">
            <i class="bi bi-shield-check me-2"></i>LOGIN AS SUPER ADMIN
          </button>
        </div>
        <div class="text-center">
          <a href="login.html" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Back to Main Login</a>
        </div>
      </form>

      <!-- BACKEND: Only display this block if multiple super admins configured -->
      <div class="alert alert-light border mt-3 small mb-0">
        <i class="bi bi-info-circle text-purple me-1" style="color:#9b59b6;"></i>
        Multiple super admin accounts can be configured. Each has full system rights.
      </div>
    </div>
  </div>
</div>
<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script>
function togglePass(inputId, iconId) {
  const p = document.getElementById(inputId);
  const i = document.getElementById(iconId);
  p.type = p.type === 'password' ? 'text' : 'password';
  i.className = p.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
}
</script>
</body>
</html>
