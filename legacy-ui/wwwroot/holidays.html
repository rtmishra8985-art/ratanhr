<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holiday Calendar | HRMS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/hrms.css">

  <!-- Theme system -->
  <link rel="stylesheet" href="/css/theme.css">
  <script src="/js/theme.js"></script>
</head>
<body>
<div id="sidebarHolder"></div>

<div class="main-content">
  <div class="container-fluid py-4">
    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between mb-4">
      <div>
        <h4 class="fw-bold mb-0"><i class="bi bi-calendar-heart me-2 text-danger"></i>Holiday Calendar</h4>
        <small class="text-muted">Manage public and optional holidays for your organisation</small>
      </div>
      <div class="d-flex gap-2">
        <select id="filterYear" class="form-select form-select-sm" style="width:100px"></select>
        <button class="btn btn-primary btn-sm" onclick="openAddModal()">
          <i class="bi bi-plus-lg me-1"></i>Add Holiday
        </button>
      </div>
    </div>

    <!-- Alert -->
    <div id="alertBox" class="alert d-none"></div>

    <!-- Stat cards -->
    <div class="row g-3 mb-4" id="statCards">
      <div class="col-6 col-md-3"><div class="card border-0 shadow-sm h-100 text-center">
        <div class="card-body py-3"><div class="fs-1 fw-bold text-primary" id="totalHolidays">—</div><div class="text-muted small">Total</div></div>
      </div></div>
      <div class="col-6 col-md-3"><div class="card border-0 shadow-sm h-100 text-center">
        <div class="card-body py-3"><div class="fs-1 fw-bold text-success" id="mandatory">—</div><div class="text-muted small">Mandatory</div></div>
      </div></div>
      <div class="col-6 col-md-3"><div class="card border-0 shadow-sm h-100 text-center">
        <div class="card-body py-3"><div class="fs-1 fw-bold text-warning" id="optional">—</div><div class="text-muted small">Optional</div></div>
      </div></div>
      <div class="col-6 col-md-3"><div class="card border-0 shadow-sm h-100 text-center">
        <div class="card-body py-3"><div class="fs-1 fw-bold text-info" id="upcoming">—</div><div class="text-muted small">Upcoming (30d)</div></div>
      </div></div>
    </div>

    <!-- Table -->
    <div class="card shadow-sm border-0">
      <div class="card-body">
        <table id="holidayTable" class="table table-striped table-hover w-100">
          <thead class="table-dark">
            <tr>
              <th>#</th><th>Date</th><th>Day</th><th>Holiday Name</th><th>Description</th>
              <th>Type</th><th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Add / Edit Modal -->
<div class="modal fade" id="holidayModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Add Holiday</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editId">
        <div class="mb-3">
          <label class="form-label fw-semibold">Holiday Name <span class="text-danger">*</span></label>
          <input type="text" id="holidayName" class="form-control" placeholder="e.g. Independence Day" maxlength="200">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Date <span class="text-danger">*</span></label>
          <input type="date" id="holidayDate" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Description</label>
          <textarea id="holidayDesc" class="form-control" rows="2" maxlength="500" placeholder="Optional description"></textarea>
        </div>
        <div class="mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="isOptional">
            <label class="form-check-label" for="isOptional">Optional Holiday (employee's choice)</label>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="saveHoliday()" id="saveBtn">
          <i class="bi bi-check-lg me-1"></i>Save
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script src="/js/api.js"></script>
<script>
// FIX CRITICAL-1: Load sidebar dynamically (replaces missing assets/js/sidebar.js)
(function() {
  const user = JSON.parse(localStorage.getItem('user') || '{}');
  const role = user.role || 'admin';
  const file = role === 'employee'
    ? '/includes/sidebar-employee.html'
    : '/includes/sidebar-admin.html';
  fetch(file)
    .then(r => r.text())
    .then(html => {
      const el = document.getElementById('sidebarHolder');
      if (el) el.innerHTML = html;
    })
    .catch(() => {});
})();
</script>
<script>
const API = '/api/holidays';
const token = null /* token is in HttpOnly cookie, no JS access needed */;
const headers = { /* Authorization: Bearer header removed - cookie-based auth */, 'Content-Type': 'application/json' };
let dt, allData = [];

const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

// Populate year selector
const yearSel = document.getElementById('filterYear');
const currentYear = new Date().getFullYear();
for (let y = currentYear - 1; y <= currentYear + 2; y++) {
  const o = new Option(y, y);
  if (y === currentYear) o.selected = true;
  yearSel.appendChild(o);
}
yearSel.addEventListener('change', loadHolidays);

async function loadHolidays() {
  const year = yearSel.value;
  const res = await fetch(`${API}?year=${year}`, { headers });
  const json = await res.json();
  allData = json.data || [];
  renderTable();
  updateStats();
}

function renderTable() {
  if (dt) { dt.destroy(); }
  const tbody = document.querySelector('#holidayTable tbody');
  tbody.innerHTML = allData.map((h, i) => {
    const d    = new Date(h.date + 'T00:00:00');
    const day  = DAYS[d.getDay()];
    const badge = h.isOptional
      ? '<span class="badge bg-warning text-dark">Optional</span>'
      : '<span class="badge bg-success">Mandatory</span>';
    return `<tr>
      <td>${i + 1}</td>
      <td><strong>${formatDate(h.date)}</strong></td>
      <td class="text-muted">${day}</td>
      <td>${h.name}</td>
      <td>${h.description || '—'}</td>
      <td>${badge}</td>
      <td>
        <button class="btn btn-sm btn-outline-primary me-1" onclick='editHoliday(${JSON.stringify(h)})'>
          <i class="bi bi-pencil"></i>
        </button>
        <button class="btn btn-sm btn-outline-danger" onclick="deleteHoliday(${h.id}, '${h.name}')">
          <i class="bi bi-trash"></i>
        </button>
      </td>
    </tr>`;
  }).join('');
  dt = new DataTable('#holidayTable', { pageLength: 25, order: [[1,'asc']] });
}

function updateStats() {
  const today = new Date();
  const in30  = new Date(); in30.setDate(in30.getDate() + 30);
  document.getElementById('totalHolidays').textContent = allData.length;
  document.getElementById('mandatory').textContent     = allData.filter(h => !h.isOptional).length;
  document.getElementById('optional').textContent      = allData.filter(h => h.isOptional).length;
  document.getElementById('upcoming').textContent      = allData.filter(h => {
    const d = new Date(h.date); return d >= today && d <= in30;
  }).length;
}

function formatDate(dateStr) {
  return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
}

function openAddModal() {
  document.getElementById('editId').value = '';
  document.getElementById('holidayName').value = '';
  document.getElementById('holidayDate').value = '';
  document.getElementById('holidayDesc').value = '';
  document.getElementById('isOptional').checked = false;
  document.getElementById('modalTitle').textContent = 'Add Holiday';
  new bootstrap.Modal(document.getElementById('holidayModal')).show();
}

function editHoliday(h) {
  document.getElementById('editId').value = h.id;
  document.getElementById('holidayName').value = h.name;
  document.getElementById('holidayDate').value = h.date;
  document.getElementById('holidayDesc').value = h.description || '';
  document.getElementById('isOptional').checked = h.isOptional;
  document.getElementById('modalTitle').textContent = 'Edit Holiday';
  new bootstrap.Modal(document.getElementById('holidayModal')).show();
}

async function saveHoliday() {
  const name = document.getElementById('holidayName').value.trim();
  const date = document.getElementById('holidayDate').value;
  if (!name || !date) { showAlert('Name and date are required.', 'danger'); return; }

  const payload = {
    name, date,
    description: document.getElementById('holidayDesc').value.trim() || null,
    isOptional: document.getElementById('isOptional').checked
  };
  const id = document.getElementById('editId').value;
  const url = id ? `${API}/${id}` : API;
  const method = id ? 'PUT' : 'POST';

  const res = await fetch(url, { method, headers, body: JSON.stringify(payload) });
  const json = await res.json();
  if (json.success) {
    bootstrap.Modal.getInstance(document.getElementById('holidayModal')).hide();
    showAlert(json.message, 'success');
    await loadHolidays();
  } else {
    showAlert(json.message || 'Error saving holiday.', 'danger');
  }
}

async function deleteHoliday(id, name) {
  if (!confirm(`Remove holiday "${name}"?`)) return;
  const res = await fetch(`${API}/${id}`, { method: 'DELETE', headers });
  const json = await res.json();
  showAlert(json.success ? json.message : json.message, json.success ? 'success' : 'danger');
  if (json.success) await loadHolidays();
}

function showAlert(msg, type) {
  const el = document.getElementById('alertBox');
  el.className = `alert alert-${type}`;
  el.textContent = msg;
  el.classList.remove('d-none');
  setTimeout(() => el.classList.add('d-none'), 4000);
}

loadHolidays();
</script>
</body>
</html>
