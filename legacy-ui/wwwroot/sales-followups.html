<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Follow Ups – RatanHR</title>
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/hrms.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/theme.css">
  <script src="/js/theme.js"></script>
</head>
<body>
<nav class="sidebar" id="sidebar">
  <div class="brand"><img src="assets/img/ratanhr-logo.png" alt="RatanHR" class="brand-logo"> RatanHR</div>
  <div class="mt-2">
    <div class="nav-label">Main</div>
    <a href="admin-dashboard.html" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <div class="nav-label">Sales</div>
    <a class="nav-link active" data-bs-toggle="collapse" href="#collapseSales"><i class="bi bi-graph-up-arrow"></i> Sales <i class="bi bi-chevron-down ms-auto small"></i></a>
    <div class="collapse show" id="collapseSales">
      <a href="sales-dashboard.html" class="sub-link">Dashboard</a>
      <a href="sales-leads.html" class="sub-link">Leads</a>
      <a href="sales-customers.html" class="sub-link">Customers</a>
      <a href="sales-followups.html" class="sub-link" style="color:#f7b731;">Follow Ups</a>
      <a href="sales-meetings.html" class="sub-link">Meetings</a>
      <a href="sales-visits.html" class="sub-link">Field Visits</a>
      <a href="sales-quotations.html" class="sub-link">Quotations</a>
      <a href="sales-tasks.html" class="sub-link">Tasks</a>
      <a href="sales-reports.html" class="sub-link">Reports</a>
    </div>
  </div>
  <button id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme">🌙</button>
</nav>
<nav class="topnav">
  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-sm d-md-none" onclick="document.getElementById('sidebar').classList.toggle('show')"><i class="bi bi-list fs-5"></i></button>
    <h6 class="mb-0 fw-semibold">Follow Ups</h6>
  </div>
  <div class="d-flex align-items-center gap-3">
    <span class="small text-muted" id="navUserName"></span>
    <div class="avatar-circle" id="navAvatar">?</div>
    <button class="btn btn-sm btn-danger px-3" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="main-panel">
  <div class="card mb-3">
    <div class="card-body py-2">
      <div class="row g-2 align-items-end">
        <div class="col-md-3">
          <select class="form-select form-select-sm" id="filterStatus">
            <option value="">All Statuses</option>
            <option>Pending</option><option>Completed</option>
          </select>
        </div>
        <div class="col-auto"><button class="btn btn-sm btn-outline-secondary" onclick="loadFollowUps()"><i class="bi bi-search"></i> Filter</button></div>
        <div class="col-auto ms-auto"><button class="btn btn-sm btn-warning" onclick="openModal()"><i class="bi bi-plus-circle me-1"></i>Schedule Follow-up</button></div>
      </div>
    </div>
  </div>

  <div class="card card-table">
    <div class="card-header fw-semibold py-3">All Follow-ups</div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead><tr><th>Lead</th><th>Reminder Date</th><th>Time</th><th>Mode</th><th>Notes</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="fuTbody"><tr><td colspan="7" class="text-center py-3 text-muted">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="fuModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="modalTitle">Schedule Follow-up</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <form id="fuForm" class="row g-3">
          <input type="hidden" id="fuId">
          <div class="col-md-6"><label class="form-label">Lead *</label><select class="form-select" id="fLeadId" required><option value="">Select Lead…</option></select></div>
          <div class="col-md-3"><label class="form-label">Reminder Date *</label><input type="date" class="form-control" id="fDate" required></div>
          <div class="col-md-3"><label class="form-label">Reminder Time</label><input type="time" class="form-control" id="fTime"></div>
          <div class="col-md-4"><label class="form-label">Mode</label>
            <select class="form-select" id="fMode">
              <option>Phone</option><option>WhatsApp</option><option>Email</option><option>Meeting</option>
            </select>
          </div>
          <div class="col-md-4"><label class="form-label">Status</label>
            <select class="form-select" id="fStatus">
              <option>Pending</option><option>Completed</option>
            </select>
          </div>
          <div class="col-12"><label class="form-label">Notes</label><textarea class="form-control" id="fNotes" rows="3"></textarea></div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-warning" onclick="saveFollowUp()">Save</button>
      </div>
    </div>
  </div>
</div>

<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
const role = sessionStorage.getItem('hrms_role') || localStorage.getItem('hrms_role');
const name = sessionStorage.getItem('hrms_name') || localStorage.getItem('hrms_name') || 'User';
if (!role) window.location.replace('/login.html');
document.getElementById('navUserName').textContent = name;
document.getElementById('navAvatar').textContent   = name.charAt(0).toUpperCase();

const urlP = new URLSearchParams(window.location.search);
const preLeadId = urlP.get('leadId');

let modal;
const MODE_ICON = { Phone: 'bi-telephone', WhatsApp: 'bi-whatsapp', Email: 'bi-envelope', Meeting: 'bi-camera-video' };

async function populateLeads() {
  const r = await HrmsApi.listLeads(1, 200);
  if (!r || !r.success) return;
  const sel = document.getElementById('fLeadId');
  sel.innerHTML = '<option value="">Select Lead…</option>' +
    r.data.map(l => `<option value="${l.id}" ${String(l.id)===String(preLeadId)?'selected':''}>${l.leadNo} – ${l.companyName}</option>`).join('');
}

function openModal(fu) {
  document.getElementById('modalTitle').textContent = fu ? 'Edit Follow-up' : 'Schedule Follow-up';
  document.getElementById('fuId').value    = fu ? fu.id : '';
  document.getElementById('fLeadId').value = fu ? fu.salesLeadId : (preLeadId || '');
  document.getElementById('fDate').value   = fu ? fu.reminderDate.substring(0,10) : '';
  document.getElementById('fTime').value   = fu?.reminderTime ?? '';
  document.getElementById('fMode').value   = fu?.mode ?? 'Phone';
  document.getElementById('fStatus').value = fu?.status ?? 'Pending';
  document.getElementById('fNotes').value  = fu?.notes ?? '';
  modal.show();
}

async function saveFollowUp() {
  const form = document.getElementById('fuForm');
  if (!form.checkValidity()) { form.reportValidity(); return; }
  const id  = document.getElementById('fuId').value;
  const dto = {
    salesLeadId: parseInt(document.getElementById('fLeadId').value),
    reminderDate: document.getElementById('fDate').value,
    reminderTime: document.getElementById('fTime').value || null,
    mode: document.getElementById('fMode').value,
    status: document.getElementById('fStatus').value,
    notes: document.getElementById('fNotes').value.trim(),
  };
  const res = id ? await HrmsApi.updateFollowUp(id, dto) : await HrmsApi.createFollowUp(dto);
  if (res && res.success) { modal.hide(); loadFollowUps(); }
  else alert((res && res.message) || 'Save failed.');
}

async function deleteFollowUp(id) {
  if (!confirm('Delete follow-up?')) return;
  const res = await HrmsApi.deleteFollowUp(id);
  if (res && res.success) loadFollowUps();
}

async function loadFollowUps() {
  const tbody = document.getElementById('fuTbody');
  tbody.innerHTML = '<tr><td colspan="7" class="text-center py-3"><span class="spinner-border spinner-border-sm me-2"></span>Loading…</td></tr>';
  const status = document.getElementById('filterStatus').value;
  const res = await HrmsApi.listFollowUps(preLeadId || null, status || null);
  if (!res || !res.success) { tbody.innerHTML = '<tr><td colspan="7" class="text-center text-danger py-3">Failed.</td></tr>'; return; }
  if (!res.data.length) { tbody.innerHTML = '<tr><td colspan="7" class="text-center py-3 text-muted">No follow-ups found.</td></tr>'; return; }
  const today = new Date().toISOString().substring(0,10);
  tbody.innerHTML = res.data.map(f => {
    const overdue = f.status === 'Pending' && f.reminderDate.substring(0,10) < today;
    return `<tr class="${overdue?'table-danger':''}">
      <td><a href="sales-leads.html" class="text-decoration-none">${f.leadCompanyName||'—'}</a></td>
      <td>${f.reminderDate.substring(0,10)}</td>
      <td>${f.reminderTime||'—'}</td>
      <td><i class="bi ${MODE_ICON[f.mode]||'bi-chat'} me-1"></i>${f.mode}</td>
      <td class="text-truncate" style="max-width:200px">${f.notes||'—'}</td>
      <td><span class="badge ${f.status==='Completed'?'bg-success':'bg-warning text-dark'}">${f.status}</span>${overdue?'<span class="badge bg-danger ms-1">Overdue</span>':''}</td>
      <td class="text-nowrap">
        <button class="btn btn-xs btn-outline-warning py-0 px-1 me-1" onclick='openModal(${JSON.stringify(f).replace(/"/g,"&quot;")})'><i class="bi bi-pencil"></i></button>
        <button class="btn btn-xs btn-outline-danger py-0 px-1" onclick="deleteFollowUp(${f.id})"><i class="bi bi-trash"></i></button>
      </td>
    </tr>`;
  }).join('');
}

modal = new bootstrap.Modal(document.getElementById('fuModal'));
populateLeads().then(loadFollowUps);
</script>
</body>
</html>
