<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16.png">

  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/hrms.css" rel="stylesheet">

  <!-- Theme system -->
  <link rel="stylesheet" href="/css/theme.css">
  <script src="/js/theme.js"></script>
</head>
<body>
<nav class="sidebar" id="sidebar">
  <div class="brand"><img src="assets/img/ratanhr-logo.png" alt="RatanHR" class="brand-logo"> RatanHR</div>
  <div class="mt-2">
    <div class="nav-label">Main</div>
    <a href="emp-dashboard.html" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <div class="nav-label">My Profile</div>
    <a class="nav-link" data-bs-toggle="collapse" href="#collapseEmp"><i class="bi bi-person-vcard"></i> Employees <i class="bi bi-chevron-down ms-auto small"></i></a>
    <div class="collapse show" id="collapseEmp">
      <a href="add-emp-details.html" class="sub-link" style="color:#f7b731;">Add Employee Details</a>
      <a href="view-emp-details.html" class="sub-link">View Employee Details</a>
    </div>
    <div class="nav-label">Attendance</div>
    <a class="nav-link" data-bs-toggle="collapse" href="#att"><i class="bi bi-clock"></i> Attendance <i class="bi bi-chevron-down ms-auto small"></i></a>
    <div class="collapse" id="att"><a href="emp-web-attendance.html" class="sub-link">Web Attendance</a></div>
    <div class="nav-label">Documents</div>
    <a class="nav-link" data-bs-toggle="collapse" href="#docs"><i class="bi bi-folder"></i> Company Docs <i class="bi bi-chevron-down ms-auto small"></i></a>
    <div class="collapse" id="docs"><a href="company-docs.html" class="sub-link">View</a></div>
  </div>

  <button id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme">🌙</button>
</nav>
<nav class="topnav">
  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-sm d-md-none" onclick="document.getElementById('sidebar').classList.toggle('show')"><i class="bi bi-list fs-5"></i></button>
    <h6 class="mb-0 fw-semibold">Add My Details</h6>
  </div>
  <div class="d-flex align-items-center gap-3">
    <div class="avatar-circle">E</div>
    <button class="btn btn-sm btn-danger px-3" onclick="logout()">Logout</button>
  </div>
</nav>
<div class="main-panel">
  <!-- BACKEND: POST /add-employee-details, enctype multipart -->
  <!-- BACKEND: Check if form already submitted (form_submitted == 1), show read-only if so -->
  <!-- <div class="alert alert-warning">You have already submitted your details. <a href="view-emp-details.html">View Details</a></div> -->

  <form action="/add-employee-details" method="POST" enctype="multipart/form-data">

    <!-- Personal Info -->
    <div class="card card-table mb-4">
      <div class="card-header py-3"><p class="section-title mb-0">Personal Information</p></div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-4"><label class="form-label fw-semibold small">Full Name <span class="text-danger">*</span></label><input class="form-control" name="fullname" required></div>
          <div class="col-md-4"><label class="form-label fw-semibold small">Gender <span class="text-danger">*</span></label>
            <select class="form-select" name="gender" required><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div>
          <div class="col-md-4"><label class="form-label fw-semibold small">Date of Birth <span class="text-danger">*</span></label><input type="date" class="form-control" name="dob" required></div>
          <div class="col-md-4"><label class="form-label fw-semibold small">Nationality</label><input class="form-control" name="nationality" placeholder="e.g. Indian"></div>
          <div class="col-md-4"><label class="form-label fw-semibold small">Marital Status</label>
            <select class="form-select" name="marital_status"><option>Single</option><option>Married</option><option>Divorced</option></select></div>
          <div class="col-md-4"><label class="form-label fw-semibold small">Blood Group</label>
            <select class="form-select" name="blood_group"><option value="">Select</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>O+</option><option>O-</option><option>AB+</option><option>AB-</option></select></div>
          <div class="col-md-6"><label class="form-label fw-semibold small">Permanent Address</label><textarea class="form-control" name="permanent_address" rows="2"></textarea></div>
          <div class="col-md-6"><label class="form-label fw-semibold small">Current Address</label><textarea class="form-control" name="current_address" rows="2"></textarea></div>
          <div class="col-md-4"><label class="form-label fw-semibold small">Aadhaar Number</label><input class="form-control" name="aadhaar" maxlength="12"></div>
          <div class="col-md-4"><label class="form-label fw-semibold small">PAN Number</label><input class="form-control" name="pan" maxlength="10"></div>
          <div class="col-md-4"><label class="form-label fw-semibold small">Identity Documents</label><input type="file" class="form-control" name="identity_docs"></div>
          <div class="col-md-4"><label class="form-label fw-semibold small">Languages Known</label><input class="form-control" name="languages"></div>
          <div class="col-md-4"><label class="form-label fw-semibold small">Hobbies</label><input class="form-control" name="hobbies"></div>
          <div class="col-md-4"><label class="form-label fw-semibold small">Medical Conditions</label><input class="form-control" name="medical_conditions"></div>
        </div>
      </div>
    </div>

    <!-- Employment Info -->
    <div class="card card-table mb-4">
      <div class="card-header py-3"><p class="section-title mb-0">Employment Information</p></div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-4"><label class="form-label fw-semibold small">Date of Joining <span class="text-danger">*</span></label><input type="date" class="form-control" name="doj" required></div>
          <div class="col-md-4"><label class="form-label fw-semibold small">Designation <span class="text-danger">*</span></label><input class="form-control" name="designation" required></div>
          <div class="col-md-4"><label class="form-label fw-semibold small">Department <span class="text-danger">*</span></label><input class="form-control" name="department" required></div>
          <div class="col-md-6"><label class="form-label fw-semibold small">Skills</label><input class="form-control" name="skills" placeholder="e.g. Java, Python, MySQL"></div>
        </div>
      </div>
    </div>

    <!-- Bank Details -->
    <div class="card card-table mb-4">
      <div class="card-header py-3"><p class="section-title mb-0">Bank Details</p></div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-4"><label class="form-label fw-semibold small">Account Holder Name</label><input class="form-control" name="bankAccountHolder"></div>
          <div class="col-md-4"><label class="form-label fw-semibold small">Bank Name</label><input class="form-control" name="bankName"></div>
          <div class="col-md-4"><label class="form-label fw-semibold small">Branch Name</label><input class="form-control" name="branchName"></div>
          <div class="col-md-4"><label class="form-label fw-semibold small">Account Number</label><input class="form-control" name="accountNumber" type="number"></div>
          <div class="col-md-4"><label class="form-label fw-semibold small">IFSC Code</label><input class="form-control" name="ifsc_code"></div>
          <div class="col-md-4"><label class="form-label fw-semibold small">UAN</label><input class="form-control" name="uan"></div>
        </div>
      </div>
    </div>

    <!-- Educational Info -->
    <div class="card card-table mb-4">
      <div class="card-header py-3"><p class="section-title mb-0">Educational Information</p></div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-4"><label class="form-label fw-semibold small">Qualification</label><input class="form-control" name="qualification" placeholder="e.g. B.Tech"></div>
          <div class="col-md-4"><label class="form-label fw-semibold small">Institution</label><input class="form-control" name="institution"></div>
          <div class="col-md-4"><label class="form-label fw-semibold small">Year of Passing</label><input class="form-control" name="year_of_passing" type="number"></div>
          <div class="col-md-4"><label class="form-label fw-semibold small">Specialization</label><input class="form-control" name="specialization"></div>
          <div class="col-md-4"><label class="form-label fw-semibold small">Educational Documents</label><input type="file" class="form-control" name="educational_docs"></div>
          <div class="col-md-4"><label class="form-label fw-semibold small">Passport Photo</label><input type="file" class="form-control" name="passport_photo" accept="image/*"></div>
        </div>
      </div>
    </div>

    <!-- Experience -->
    <div class="card card-table mb-4">
      <div class="card-header py-3"><p class="section-title mb-0">Work Experience</p></div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-4"><label class="form-label fw-semibold small">Previous Employer</label><input class="form-control" name="previous_employer"></div>
          <div class="col-md-4"><label class="form-label fw-semibold small">Job Title</label><input class="form-control" name="job_title"></div>
          <div class="col-md-4"><label class="form-label fw-semibold small">Duration</label><input class="form-control" name="duration" placeholder="e.g. 2019 – 2022"></div>
          <div class="col-md-8"><label class="form-label fw-semibold small">Responsibilities</label><textarea class="form-control" name="responsibilities" rows="2"></textarea></div>
          <div class="col-md-4"><label class="form-label fw-semibold small">Experience Documents</label><input type="file" class="form-control" name="experience_docs"></div>
        </div>
      </div>
    </div>

    <!-- Emergency Contact -->
    <div class="card card-table mb-4">
      <div class="card-header py-3"><p class="section-title mb-0">Emergency Contact</p></div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-3"><label class="form-label fw-semibold small">Name</label><input class="form-control" name="emergency_contact_name"></div>
          <div class="col-md-3"><label class="form-label fw-semibold small">Relationship</label><input class="form-control" name="emergency_contact_relationship"></div>
          <div class="col-md-3"><label class="form-label fw-semibold small">Phone</label><input class="form-control" name="emergency_contact_phone"></div>
          <div class="col-md-3"><label class="form-label fw-semibold small">Address</label><input class="form-control" name="emergency_contact_address"></div>
        </div>
      </div>
    </div>

    <div class="text-center pb-4">
      <button type="submit" class="btn btn-warning fw-bold px-5 py-2"><i class="bi bi-save me-2"></i>Submit My Details</button>
    </div>
  </form>
</div>
<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
