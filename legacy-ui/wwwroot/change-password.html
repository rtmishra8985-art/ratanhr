<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <title>Change Password – RatanHR</title>
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/hrms.css" rel="stylesheet">

  <!-- Theme system -->
  <link rel="stylesheet" href="/css/theme.css">
  <script src="/js/theme.js"></script>
</head>
<body>
<div class="login-wrapper">
  <div class="login-card card">
    <div class="card-body">
      <div class="text-center mb-4">
        <div class="mb-3" style="font-size:48px;">🔐</div>
        <h4 class="fw-bold">Set a New Password</h4>
        <p class="text-muted small">For security, you must set your own password before continuing.</p>
      </div>
      <div id="alertBox" class="alert d-none py-2 small"></div>
      <form id="changeForm">
        <div class="mb-3">
          <label class="form-label fw-semibold small">Current (Temporary) Password</label>
          <input type="password" class="form-control" id="currentPassword" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold small">New Password</label>
          <input type="password" class="form-control" id="newPassword" required minlength="8">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold small">Confirm New Password</label>
          <input type="password" class="form-control" id="confirmPassword" required minlength="8">
        </div>
        <div class="d-grid mb-3">
          <button type="submit" class="btn btn-login btn-lg" id="submitBtn">SET PASSWORD</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="js/api.js"></script>
<script>
  if (!getToken()) window.location.href = 'login.html';

  document.getElementById('changeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const box = document.getElementById('alertBox');
    box.className = 'alert d-none';
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    if (newPassword !== confirmPassword) {
      box.className = 'alert alert-danger py-2 small';
      box.textContent = 'Passwords do not match.';
      return;
    }
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    try {
      const res = await HrmsApi.changePassword({
        currentPassword: document.getElementById('currentPassword').value,
        newPassword, confirmPassword
      });
      if (res && res.success) {
        const role = localStorage.getItem('hrms_role');
        window.location.href = role === 'superadmin' ? 'superadmin-dashboard.html'
          : role === 'admin' ? 'admin-dashboard.html' : 'emp-dashboard.html';
      } else {
        box.className = 'alert alert-danger py-2 small';
        box.textContent = (res && res.message) || 'Could not change password.';
      }
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
