<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <title>Employee Dashboard – RatanHR</title>
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/hrms.css" rel="stylesheet">

  <!-- Theme system -->
  <link rel="stylesheet" href="/css/theme.css">
  <script src="/js/theme.js"></script>
</head>
<body>
<div id="sidebarHolder"></div>

<!-- TOPNAV -->
<nav class="topnav">
  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-sm d-md-none" onclick="document.getElementById('sidebar').classList.toggle('show')"><i class="bi bi-list fs-5"></i></button>
    <h6 class="mb-0 fw-semibold">My Dashboard</h6>
  </div>
  <div class="d-flex align-items-center gap-3">
    <div class="text-end d-none d-sm-block">
      <div class="fw-semibold small" id="navUserName"></div>
      <div class="text-muted" style="font-size:11px;" id="navUserRole"></div>
    </div>
    <div class="avatar-circle" id="navAvatar">E</div>
    <button class="btn btn-sm btn-danger px-3" onclick="logout()">Logout</button>
  </div>

  <button id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme">🌙</button>
</nav>

<!-- MAIN PANEL -->
<div class="main-panel">

  <!-- Welcome Banner -->
  <div class="p-4 mb-4 rounded-3 text-white" style="background:linear-gradient(135deg,#1a1a2e,#16213e);">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div>
        <h4 class="fw-bold mb-1">Welcome, <span id="welcomeName">Employee</span>! 👋</h4>
        <p class="mb-0 opacity-75 small" id="welcomeSub">Loading profile…</p>
      </div>
      <code class="text-warning fs-6" id="welcomeEmpId"></code>
    </div>
  </div>

  <!-- Stats -->
  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="stat-card">
        <div class="stat-label">My Employee ID</div>
        <div class="stat-value" style="font-size:20px;" id="statEmpId"><code>–</code></div>
        <div class="text-muted small mt-1" id="statDeptDesig">–</div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="stat-card">
        <div class="stat-label">Present This Month</div>
        <div class="stat-value text-success" id="statPresent">–</div>
        <div class="text-muted small mt-1">Days attended</div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="stat-card">
        <div class="stat-label">Pending Leave Requests</div>
        <div class="stat-value text-warning" id="statLeave">–</div>
        <div class="text-muted small mt-1"><a href="leave.html" class="text-warning text-decoration-none">Manage leaves →</a></div>
      </div>
    </div>
  </div>

  <!-- Quick Links -->
  <div class="row g-3">
    <div class="col-md-3 col-6">
      <a href="view-emp-details.html" class="card text-decoration-none text-center p-3 card-table h-100">
        <div class="card-body">
          <i class="bi bi-person-vcard text-warning" style="font-size:32px;"></i>
          <p class="fw-semibold small mt-2 mb-0">My Profile</p>
        </div>
      </a>
    </div>
    <div class="col-md-3 col-6">
      <a href="emp-web-attendance.html" class="card text-decoration-none text-center p-3 card-table h-100">
        <div class="card-body">
          <i class="bi bi-clock text-success" style="font-size:32px;"></i>
          <p class="fw-semibold small mt-2 mb-0">Check In / Out</p>
        </div>
      </a>
    </div>
    <div class="col-md-3 col-6">
      <a href="leave.html" class="card text-decoration-none text-center p-3 card-table h-100">
        <div class="card-body">
          <i class="bi bi-calendar2-check text-info" style="font-size:32px;"></i>
          <p class="fw-semibold small mt-2 mb-0">My Leave</p>
        </div>
      </a>
    </div>
    <div class="col-md-3 col-6">
      <a href="emp-payslip.html" class="card text-decoration-none text-center p-3 card-table h-100">
        <div class="card-body">
          <i class="bi bi-receipt text-primary" style="font-size:32px;"></i>
          <p class="fw-semibold small mt-2 mb-0">My Payslip</p>
        </div>
      </a>
    </div>
    <div class="col-md-3 col-6">
      <a href="company-docs.html" class="card text-decoration-none text-center p-3 card-table h-100">
        <div class="card-body">
          <i class="bi bi-folder text-secondary" style="font-size:32px;"></i>
          <p class="fw-semibold small mt-2 mb-0">Company Docs</p>
        </div>
      </a>
    </div>
    <div class="col-md-3 col-6">
      <a href="emp-appreciation.html" class="card text-decoration-none text-center p-3 card-table h-100">
        <div class="card-body">
          <i class="bi bi-trophy text-danger" style="font-size:32px;"></i>
          <p class="fw-semibold small mt-2 mb-0">My Appreciation</p>
        </div>
      </a>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
if (!requireAuth(['employee'])) throw new Error('unauthorized');

const empId = localStorage.getItem('hrms_employeeId') || sessionStorage.getItem('hrms_employeeId') || '';
const name  = localStorage.getItem('hrms_name') || sessionStorage.getItem('hrms_name') || 'Employee';

populateTopnav();
document.getElementById('welcomeName').textContent = name;
document.getElementById('welcomeEmpId').textContent = empId;

async function loadProfile() {
  const res = await HrmsApi.myProfile();
  if (res && res.data) {
    const d = res.data;
    document.getElementById('welcomeSub').textContent =
      new Date().toLocaleDateString('en-IN', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
    document.getElementById('statEmpId').innerHTML = `<code>${empId || '—'}</code>`;
    document.getElementById('statDeptDesig').textContent = [d.designation, d.department].filter(Boolean).join(' · ') || 'Employee';
  }
}

async function loadAttendance() {
  const now = new Date();
  const params = {
    year: now.getFullYear(),
    month: now.getMonth() + 1
  };
  const res = await HrmsApi.getMyAttendance(params);
  const rows = res.data || [];
  const present = rows.filter(r => r.status === 'Present' || r.checkIn).length;
  document.getElementById('statPresent').textContent = present;
}

async function loadLeaveBalance() {
  const res = await HrmsApi.myLeaveRequests();
  const pending = (res.data || []).filter(r => r.status === 'Pending').length;
  document.getElementById('statLeave').textContent = pending;
}

fetch('includes/sidebar-employee.html').then(r => r.text()).then(html => {
  document.getElementById('sidebarHolder').innerHTML = html;
  document.querySelectorAll('#sidebar .nav-link').forEach(a => {
    if (a.getAttribute('href') === 'emp-dashboard.html') a.classList.add('active');
  });
});

Promise.all([loadProfile(), loadAttendance(), loadLeaveBalance()]);
</script>
<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
