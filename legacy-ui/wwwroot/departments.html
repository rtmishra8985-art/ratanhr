<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Departments &amp; Designations | HRMS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/hrms.css">

  <!-- Theme system -->
  <link rel="stylesheet" href="/css/theme.css">
  <script src="/js/theme.js"></script>
</head>
<body>
<div id="sidebarHolder"></div>

<div class="main-content">
  <div class="container-fluid py-4">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <div>
        <h4 class="fw-bold mb-0"><i class="bi bi-diagram-3 me-2 text-primary"></i>Departments &amp; Designations</h4>
        <small class="text-muted">Manage your organisation's department and job title master data</small>
      </div>
    </div>

    <div id="alertBox" class="alert d-none"></div>

    <!-- Tabs -->
    <ul class="nav nav-tabs mb-3" id="masterTabs">
      <li class="nav-item">
        <a class="nav-link active" id="deptTab" href="#" onclick="switchTab('department'); return false;">
          <i class="bi bi-building me-1"></i>Departments
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" id="desgTab" href="#" onclick="switchTab('designation'); return false;">
          <i class="bi bi-person-badge me-1"></i>Designations
        </a>
      </li>
    </ul>

    <!-- Department Panel -->
    <div id="deptPanel">
      <div class="d-flex justify-content-end mb-2">
        <button class="btn btn-primary btn-sm" onclick="openModal('department', null)">
          <i class="bi bi-plus-lg me-1"></i>Add Department
        </button>
      </div>
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <table id="deptTable" class="table table-striped table-hover w-100">
            <thead class="table-dark"><tr><th>#</th><th>Name</th><th>Description</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Designation Panel -->
    <div id="desgPanel" class="d-none">
      <div class="d-flex justify-content-end mb-2">
        <button class="btn btn-primary btn-sm" onclick="openModal('designation', null)">
          <i class="bi bi-plus-lg me-1"></i>Add Designation
        </button>
      </div>
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <table id="desgTable" class="table table-striped table-hover w-100">
            <thead class="table-dark"><tr><th>#</th><th>Name</th><th>Description</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal fade" id="masterModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Add</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editId">
        <input type="hidden" id="editKind">
        <div class="mb-3">
          <label class="form-label fw-semibold">Name <span class="text-danger">*</span></label>
          <input type="text" id="masterName" class="form-control" maxlength="200" placeholder="Enter name">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Description</label>
          <textarea id="masterDesc" class="form-control" rows="2" maxlength="500" placeholder="Optional"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="saveMaster()"><i class="bi bi-check-lg me-1"></i>Save</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script src="/js/api.js"></script>
<script>
// FIX CRITICAL-1: Load sidebar dynamically (replaces missing assets/js/sidebar.js)
(function() {
  const user = JSON.parse(localStorage.getItem('user') || '{}');
  const role = user.role || 'admin';
  const file = role === 'employee'
    ? '/includes/sidebar-employee.html'
    : '/includes/sidebar-admin.html';
  fetch(file)
    .then(r => r.text())
    .then(html => {
      const el = document.getElementById('sidebarHolder');
      if (el) el.innerHTML = html;
    })
    .catch(() => {});
})();
</script>
<script>
const BASE   = '/api/organisation';
const token  = null /* token is in HttpOnly cookie, no JS access needed */;
const headers = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' };

let deptDt, desgDt;
let currentTab = 'department';

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('deptPanel').classList.toggle('d-none', tab !== 'department');
  document.getElementById('desgPanel').classList.toggle('d-none', tab !== 'designation');
  document.getElementById('deptTab').classList.toggle('active', tab === 'department');
  document.getElementById('desgTab').classList.toggle('active', tab === 'designation');
}

async function loadDepartments() {
  const res = await fetch(`${BASE}/departments`, { headers });
  const json = await res.json();
  const data = json.data || [];
  if (deptDt) deptDt.destroy();
  const tbody = document.querySelector('#deptTable tbody');
  tbody.innerHTML = data.map((d, i) => `
    <tr>
      <td>${i+1}</td><td>${d.name}</td><td>${d.description || '—'}</td>
      <td><span class="badge ${d.isActive ? 'bg-success' : 'bg-secondary'}">${d.isActive ? 'Active' : 'Inactive'}</span></td>
      <td>
        <button class="btn btn-sm btn-outline-primary me-1" onclick='openModal("department", ${JSON.stringify(d)})'>
          <i class="bi bi-pencil"></i></button>
        <button class="btn btn-sm btn-outline-danger" onclick='deleteMaster("departments", ${d.id}, "${d.name}")'>
          <i class="bi bi-trash"></i></button>
      </td>
    </tr>`).join('');
  deptDt = new DataTable('#deptTable', { pageLength: 20 });
}

async function loadDesignations() {
  const res = await fetch(`${BASE}/designations`, { headers });
  const json = await res.json();
  const data = json.data || [];
  if (desgDt) desgDt.destroy();
  const tbody = document.querySelector('#desgTable tbody');
  tbody.innerHTML = data.map((d, i) => `
    <tr>
      <td>${i+1}</td><td>${d.name}</td><td>${d.description || '—'}</td>
      <td><span class="badge ${d.isActive ? 'bg-success' : 'bg-secondary'}">${d.isActive ? 'Active' : 'Inactive'}</span></td>
      <td>
        <button class="btn btn-sm btn-outline-primary me-1" onclick='openModal("designation", ${JSON.stringify(d)})'>
          <i class="bi bi-pencil"></i></button>
        <button class="btn btn-sm btn-outline-danger" onclick='deleteMaster("designations", ${d.id}, "${d.name}")'>
          <i class="bi bi-trash"></i></button>
      </td>
    </tr>`).join('');
  desgDt = new DataTable('#desgTable', { pageLength: 20 });
}

function openModal(kind, item) {
  document.getElementById('editId').value   = item?.id || '';
  document.getElementById('editKind').value = kind;
  document.getElementById('masterName').value = item?.name || '';
  document.getElementById('masterDesc').value = item?.description || '';
  const title = (item ? 'Edit' : 'Add') + ' ' + (kind === 'department' ? 'Department' : 'Designation');
  document.getElementById('modalTitle').textContent = title;
  new bootstrap.Modal(document.getElementById('masterModal')).show();
}

async function saveMaster() {
  const name = document.getElementById('masterName').value.trim();
  if (!name) { showAlert('Name is required.', 'danger'); return; }
  const kind = document.getElementById('editKind').value;
  const id   = document.getElementById('editId').value;
  const path = kind === 'department' ? 'departments' : 'designations';
  const payload = { name, description: document.getElementById('masterDesc').value.trim() || null };
  const url = id ? `${BASE}/${path}/${id}` : `${BASE}/${path}`;
  const res = await fetch(url, { method: id ? 'PUT' : 'POST', headers, body: JSON.stringify(payload) });
  const json = await res.json();
  if (json.success) {
    bootstrap.Modal.getInstance(document.getElementById('masterModal')).hide();
    showAlert(json.message, 'success');
    kind === 'department' ? loadDepartments() : loadDesignations();
  } else {
    showAlert(json.message, 'danger');
  }
}

async function deleteMaster(path, id, name) {
  if (!confirm(`Remove "${name}"?`)) return;
  const res = await fetch(`${BASE}/${path}/${id}`, { method: 'DELETE', headers });
  const json = await res.json();
  showAlert(json.message, json.success ? 'success' : 'danger');
  if (json.success) { loadDepartments(); loadDesignations(); }
}

function showAlert(msg, type) {
  const el = document.getElementById('alertBox');
  el.className = `alert alert-${type}`; el.textContent = msg; el.classList.remove('d-none');
  setTimeout(() => el.classList.add('d-none'), 4000);
}

loadDepartments();
loadDesignations();
</script>
</body>
</html>
