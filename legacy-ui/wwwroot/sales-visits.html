<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Field Visits – RatanHR</title>
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/hrms.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/theme.css">
  <script src="/js/theme.js"></script>
</head>
<body>
<div id="sidebarHolder"></div>
<nav class="topnav">
  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-sm d-md-none" onclick="document.getElementById('sidebar').classList.toggle('show')"><i class="bi bi-list fs-5"></i></button>
    <h6 class="mb-0 fw-semibold">Field Visits</h6>
  </div>
  <div class="d-flex align-items-center gap-3">
    <span class="small text-muted" id="navUserName"></span>
    <div class="avatar-circle" id="navAvatar">?</div>
    <button class="btn btn-sm btn-danger px-3" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="main-panel">
  <div class="card mb-3">
    <div class="card-body py-2 d-flex justify-content-end">
      <button class="btn btn-sm btn-warning" onclick="openCheckInModal()"><i class="bi bi-geo-alt-fill me-1"></i>Check In</button>
    </div>
  </div>

  <div class="card card-table">
    <div class="card-header fw-semibold py-3">Visit Log</div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead><tr><th>Employee</th><th>Lead / Customer</th><th>Check-in Address</th><th>Check-In</th><th>Check-Out</th><th>Duration</th><th>Distance</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="visitTbody"><tr><td colspan="9" class="text-center py-3 text-muted">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Check-In Modal -->
<div class="modal fade" id="checkInModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Check In</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <form id="checkInForm" class="row g-3">
          <div class="col-12"><label class="form-label">Employee ID *</label><input type="text" class="form-control" id="fEmpId" required></div>
          <div class="col-md-6"><label class="form-label">Lead</label><select class="form-select" id="fLeadId"><option value="">None</option></select></div>
          <div class="col-md-6"><label class="form-label">Customer</label><select class="form-select" id="fCustId"><option value="">None</option></select></div>
          <div class="col-md-6"><label class="form-label">Latitude</label><input type="number" step="0.0000001" class="form-control" id="fLat"></div>
          <div class="col-md-6"><label class="form-label">Longitude</label><input type="number" step="0.0000001" class="form-control" id="fLng"></div>
          <div class="col-12"><label class="form-label">Address *</label><textarea class="form-control" id="fAddress" rows="2" required></textarea></div>
          <div class="col-auto">
            <button type="button" class="btn btn-sm btn-outline-primary" onclick="getGPS()"><i class="bi bi-crosshair me-1"></i>Get GPS</button>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-warning" onclick="doCheckIn()">Check In</button>
      </div>
    </div>
  </div>
</div>

<!-- Check-Out Modal -->
<div class="modal fade" id="checkOutModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Check Out</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <form class="row g-3">
          <input type="hidden" id="coVisitId">
          <div class="col-12"><label class="form-label">Distance (km)</label><input type="number" step="0.1" min="0" class="form-control" id="coDistance"></div>
          <div class="col-12"><label class="form-label">Notes</label><textarea class="form-control" id="coNotes" rows="2"></textarea></div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-success" onclick="doCheckOut()">Check Out</button>
      </div>
    </div>
  </div>
</div>

<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
const role = sessionStorage.getItem('hrms_role') || localStorage.getItem('hrms_role');
const name = sessionStorage.getItem('hrms_name') || localStorage.getItem('hrms_name') || 'User';
if (!role) window.location.replace('/login.html');
document.getElementById('navUserName').textContent = name;
document.getElementById('navAvatar').textContent   = name.charAt(0).toUpperCase();

let checkInModal, checkOutModal;

async function populateRefs() {
  const [lr, cr] = await Promise.all([HrmsApi.listLeads(1,200), HrmsApi.listCustomers(1,200)]);
  const lSel = document.getElementById('fLeadId');
  const cSel = document.getElementById('fCustId');
  if (lr?.success) lr.data.forEach(l => { lSel.add(new Option(`${l.leadNo} – ${l.companyName}`, l.id)); });
  if (cr?.success) cr.data.forEach(c => { cSel.add(new Option(c.companyName, c.id)); });
}

function getGPS() {
  if (!navigator.geolocation) { alert('Geolocation not supported.'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    document.getElementById('fLat').value = pos.coords.latitude.toFixed(7);
    document.getElementById('fLng').value = pos.coords.longitude.toFixed(7);
  }, () => alert('Could not get location.'));
}

function openCheckInModal() {
  document.getElementById('checkInForm').reset();
  document.getElementById('fEmpId').value = sessionStorage.getItem('hrms_employeeId') || localStorage.getItem('hrms_employeeId') || '';
  checkInModal.show();
}

async function doCheckIn() {
  const form = document.getElementById('checkInForm');
  if (!form.checkValidity()) { form.reportValidity(); return; }
  const dto = {
    visitedEmployeeId: document.getElementById('fEmpId').value.trim(),
    salesLeadId: document.getElementById('fLeadId').value ? parseInt(document.getElementById('fLeadId').value) : null,
    salesCustomerId: document.getElementById('fCustId').value ? parseInt(document.getElementById('fCustId').value) : null,
    latitude: document.getElementById('fLat').value ? parseFloat(document.getElementById('fLat').value) : null,
    longitude: document.getElementById('fLng').value ? parseFloat(document.getElementById('fLng').value) : null,
    address: document.getElementById('fAddress').value.trim(),
  };
  const res = await HrmsApi.salesCheckIn(dto);
  if (res && res.success) { checkInModal.hide(); loadVisits(); }
  else alert((res && res.message) || 'Check-in failed.');
}

function openCheckOut(id) {
  document.getElementById('coVisitId').value = id;
  document.getElementById('coDistance').value = '';
  document.getElementById('coNotes').value = '';
  checkOutModal.show();
}

async function doCheckOut() {
  const id  = document.getElementById('coVisitId').value;
  const dto = { distanceKm: document.getElementById('coDistance').value || null, notes: document.getElementById('coNotes').value.trim() };
  const res = await HrmsApi.salesCheckOut(id, dto);
  if (res && res.success) { checkOutModal.hide(); loadVisits(); }
  else alert((res && res.message) || 'Check-out failed.');
}

async function deleteVisit(id) {
  if (!confirm('Delete this visit?')) return;
  const res = await HrmsApi.deleteVisit(id);
  if (res && res.success) loadVisits();
}

async function loadVisits() {
  const tbody = document.getElementById('visitTbody');
  tbody.innerHTML = '<tr><td colspan="9" class="text-center py-3"><span class="spinner-border spinner-border-sm me-2"></span>Loading…</td></tr>';
  const res = await HrmsApi.listVisits();
  if (!res || !res.success) { tbody.innerHTML = '<tr><td colspan="9" class="text-center text-danger py-3">Failed.</td></tr>'; return; }
  if (!res.data.length) { tbody.innerHTML = '<tr><td colspan="9" class="text-center py-3 text-muted">No visits found.</td></tr>'; return; }
  tbody.innerHTML = res.data.map(v => `<tr>
    <td>${v.employeeName||v.visitedEmployeeId}</td>
    <td>${v.leadCompanyName || v.customerCompanyName || '—'}</td>
    <td class="text-truncate" style="max-width:180px">${v.checkInAddress||'—'}</td>
    <td>${v.checkInTime ? new Date(v.checkInTime).toLocaleString('en-IN') : '—'}</td>
    <td>${v.checkOutTime ? new Date(v.checkOutTime).toLocaleString('en-IN') : '—'}</td>
    <td>${v.durationMinutes != null ? v.durationMinutes + ' min' : '—'}</td>
    <td>${v.distanceKm != null ? v.distanceKm + ' km' : '—'}</td>
    <td><span class="badge ${v.status==='CheckedOut'?'bg-success':'bg-warning text-dark'}">${v.status}</span></td>
    <td class="text-nowrap">
      ${v.status==='CheckedIn' ? `<button class="btn btn-xs btn-outline-success py-0 px-1 me-1" onclick="openCheckOut(${v.id})"><i class="bi bi-box-arrow-right"></i> Out</button>` : ''}
      <button class="btn btn-xs btn-outline-danger py-0 px-1" onclick="deleteVisit(${v.id})"><i class="bi bi-trash"></i></button>
    </td>
  </tr>`).join('');
}

checkInModal  = new bootstrap.Modal(document.getElementById('checkInModal'));
checkOutModal = new bootstrap.Modal(document.getElementById('checkOutModal'));
populateRefs().then(loadVisits);
</script>
<script>
// Load shared admin sidebar and mark active Sales > Field Visits link
fetch('includes/sidebar-admin.html').then(r => r.text()).then(html => {
  document.getElementById('sidebarHolder').innerHTML = html;
  document.querySelectorAll('#sidebar .sub-link').forEach(a => {
    if (a.getAttribute('href') === 'sales-visits.html') a.classList.add('active');
  });
  document.querySelectorAll('#sidebar .nav-link[href="#collapseSales"]').forEach(el => {
    el.classList.remove('collapsed');
    const target = document.getElementById('collapseSales');
    if (target) target.classList.add('show');
  });
}).catch(() => {});
</script>
<script>
fetch('includes/sidebar-admin.html').then(r => r.text()).then(html => {
  document.getElementById('sidebarHolder').innerHTML = html;
  document.querySelectorAll('#sidebar .sub-link').forEach(a => {
    if (a.getAttribute('href') === 'sales-visits.html') a.classList.add('active');
  });
  const salesMenu = document.getElementById('collapseSales');
  if (salesMenu) salesMenu.classList.add('show');
  document.querySelectorAll('#sidebar [href="#collapseSales"]').forEach(el => el.classList.remove('collapsed'));
}).catch(() => {});
</script>
</body>
</html>
