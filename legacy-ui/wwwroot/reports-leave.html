<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave Report | HRMS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/hrms.css">

  <!-- Theme system -->
  <link rel="stylesheet" href="/css/theme.css">
  <script src="/js/theme.js"></script>
</head>
<body>
<div id="sidebarHolder"></div>

<div class="main-content">
  <div class="container-fluid py-4">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <div>
        <h4 class="fw-bold mb-0"><i class="bi bi-calendar2-minus me-2 text-warning"></i>Leave Utilisation Report</h4>
        <small class="text-muted">View and export leave requests by month or full year</small>
      </div>
    </div>

    <div id="alertBox" class="alert d-none"></div>

    <!-- Filters -->
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body">
        <div class="row g-3 align-items-end">
          <div class="col-md-3">
            <label class="form-label fw-semibold">Month</label>
            <select id="selMonth" class="form-select">
              <option value="0">Full Year</option>
              <option value="1">January</option><option value="2">February</option>
              <option value="3">March</option><option value="4">April</option>
              <option value="5">May</option><option value="6">June</option>
              <option value="7">July</option><option value="8">August</option>
              <option value="9">September</option><option value="10">October</option>
              <option value="11">November</option><option value="12">December</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold">Year</label>
            <select id="selYear" class="form-select"></select>
          </div>
          <div class="col-md-3">
            <button class="btn btn-primary w-100" onclick="loadReport()">
              <i class="bi bi-search me-1"></i>Generate Report
            </button>
          </div>
          <div class="col-md-3">
            <button class="btn btn-success w-100" onclick="exportReport()">
              <i class="bi bi-file-earmark-excel me-1"></i>Export Excel
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Summary cards -->
    <div class="row g-3 mb-4" id="summaryCards" style="display:none!important">
      <div class="col-6 col-md-3"><div class="card border-0 shadow-sm text-center">
        <div class="card-body py-3"><div class="fs-2 fw-bold text-primary" id="totalReq">—</div><div class="text-muted small">Total Requests</div></div>
      </div></div>
      <div class="col-6 col-md-3"><div class="card border-0 shadow-sm text-center">
        <div class="card-body py-3"><div class="fs-2 fw-bold text-success" id="approvedReq">—</div><div class="text-muted small">Approved</div></div>
      </div></div>
      <div class="col-6 col-md-3"><div class="card border-0 shadow-sm text-center">
        <div class="card-body py-3"><div class="fs-2 fw-bold text-danger" id="rejectedReq">—</div><div class="text-muted small">Rejected</div></div>
      </div></div>
      <div class="col-6 col-md-3"><div class="card border-0 shadow-sm text-center">
        <div class="card-body py-3"><div class="fs-2 fw-bold text-warning" id="pendingReq">—</div><div class="text-muted small">Pending</div></div>
      </div></div>
    </div>
    <div class="row g-3 mb-4" id="daysCard" style="display:none!important">
      <div class="col"><div class="card border-0 shadow-sm text-center">
        <div class="card-body py-3"><div class="fs-2 fw-bold text-info" id="totalDays">—</div>
          <div class="text-muted small">Total Days Approved</div></div>
      </div></div>
    </div>

    <!-- Detail table -->
    <div class="card shadow-sm border-0" id="tableCard" style="display:none!important">
      <div class="card-body">
        <table id="leaveTable" class="table table-striped table-hover w-100">
          <thead class="table-dark">
            <tr>
              <th>#</th><th>Employee ID</th><th>Employee Name</th><th>Leave Type</th>
              <th>Start</th><th>End</th><th>Days</th><th>Status</th><th>Reason</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
    <div class="text-center py-5 text-muted" id="emptyState">
      <i class="bi bi-calendar2-minus fs-1 mb-2"></i>
      <p>Select a period and click "Generate Report" to view leave data.</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script src="/js/api.js"></script>
<script>
// FIX CRITICAL-1: Load sidebar dynamically (replaces missing assets/js/sidebar.js)
(function() {
  const user = JSON.parse(localStorage.getItem('user') || '{}');
  const role = user.role || 'admin';
  const file = role === 'employee'
    ? '/includes/sidebar-employee.html'
    : '/includes/sidebar-admin.html';
  fetch(file)
    .then(r => r.text())
    .then(html => {
      const el = document.getElementById('sidebarHolder');
      if (el) el.innerHTML = html;
    })
    .catch(() => {});
})();
</script>
<script>
const token   = null /* token is in HttpOnly cookie, no JS access needed */;
const headers = { Authorization: `Bearer ${token}` };
let dt;

// Populate year selector
const yearSel = document.getElementById('selYear');
const cy = new Date().getFullYear();
for (let y = cy - 2; y <= cy + 1; y++) {
  const o = new Option(y, y);
  if (y === cy) o.selected = true;
  yearSel.appendChild(o);
}
// Pre-select current month
document.getElementById('selMonth').value = new Date().getMonth() + 1;

function params() {
  const m = document.getElementById('selMonth').value;
  const y = document.getElementById('selYear').value;
  return `month=${m}&year=${y}`;
}

async function loadReport() {
  try {
    const res  = await fetch(`/api/reports/leave/monthly?${params()}`, { headers });
    const json = await res.json();
    if (!json.success) { showAlert(json.message, 'danger'); return; }
    const data = json.data;

    // Summary
    document.getElementById('totalReq').textContent    = data.totalRequests;
    document.getElementById('approvedReq').textContent = data.approved;
    document.getElementById('rejectedReq').textContent = data.rejected;
    document.getElementById('pendingReq').textContent  = data.pending;
    document.getElementById('totalDays').textContent   = data.totalDaysApproved;

    document.getElementById('summaryCards').style.removeProperty('display');
    document.getElementById('daysCard').style.removeProperty('display');
    document.getElementById('tableCard').style.removeProperty('display');
    document.getElementById('emptyState').style.display = 'none';

    if (dt) { dt.destroy(); document.querySelector('#leaveTable tbody').innerHTML = ''; }

    const tbody = document.querySelector('#leaveTable tbody');
    tbody.innerHTML = data.details.map((d, i) => {
      const badgeClass = d.status === 'Approved' ? 'bg-success' : d.status === 'Rejected' ? 'bg-danger' : 'bg-warning text-dark';
      return `<tr>
        <td>${i+1}</td>
        <td>${d.employeeId}</td>
        <td>${d.employeeName || '—'}</td>
        <td>${d.leaveTypeName || '—'}</td>
        <td>${d.startDate}</td>
        <td>${d.endDate}</td>
        <td class="text-center fw-semibold">${d.totalDays}</td>
        <td><span class="badge ${badgeClass}">${d.status}</span></td>
        <td class="text-muted small">${d.reason || '—'}</td>
      </tr>`;
    }).join('');
    dt = new DataTable('#leaveTable', { pageLength: 25 });
  } catch (e) {
    showAlert('Failed to load report: ' + e.message, 'danger');
  }
}

async function exportReport() {
  const url = `/api/reports/leave/export?${params()}`;
  const res = await fetch(url, { headers });
  if (!res.ok) { showAlert('Export failed.', 'danger'); return; }
  const blob = await res.blob();
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = `LeaveReport_${document.getElementById('selYear').value}_${String(document.getElementById('selMonth').value).padStart(2,'0')}.xlsx`;
  a.click();
}

function showAlert(msg, type) {
  const el = document.getElementById('alertBox');
  el.className = `alert alert-${type}`; el.textContent = msg; el.classList.remove('d-none');
  setTimeout(() => el.classList.add('d-none'), 5000);
}
</script>
</body>
</html>
