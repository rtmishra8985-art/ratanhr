<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leads – RatanHR</title>
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/hrms.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/theme.css">
  <script src="/js/theme.js"></script>
</head>
<body>
<nav class="sidebar" id="sidebar">
  <div class="brand"><img src="assets/img/ratanhr-logo.png" alt="RatanHR" class="brand-logo"> RatanHR</div>
  <div class="mt-2">
    <div class="nav-label">Main</div>
    <a href="admin-dashboard.html" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <div class="nav-label">Sales</div>
    <a class="nav-link active" data-bs-toggle="collapse" href="#collapseSales"><i class="bi bi-graph-up-arrow"></i> Sales <i class="bi bi-chevron-down ms-auto small"></i></a>
    <div class="collapse show" id="collapseSales">
      <a href="sales-dashboard.html" class="sub-link">Dashboard</a>
      <a href="sales-leads.html" class="sub-link" style="color:#f7b731;">Leads</a>
      <a href="sales-customers.html" class="sub-link">Customers</a>
      <a href="sales-followups.html" class="sub-link">Follow Ups</a>
      <a href="sales-meetings.html" class="sub-link">Meetings</a>
      <a href="sales-visits.html" class="sub-link">Field Visits</a>
      <a href="sales-quotations.html" class="sub-link">Quotations</a>
      <a href="sales-tasks.html" class="sub-link">Tasks</a>
      <a href="sales-reports.html" class="sub-link">Reports</a>
    </div>
  </div>
  <button id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme">🌙</button>
</nav>
<nav class="topnav">
  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-sm d-md-none" onclick="document.getElementById('sidebar').classList.toggle('show')"><i class="bi bi-list fs-5"></i></button>
    <h6 class="mb-0 fw-semibold">Leads</h6>
  </div>
  <div class="d-flex align-items-center gap-3">
    <span class="small text-muted" id="navUserName"></span>
    <div class="avatar-circle" id="navAvatar">?</div>
    <button class="btn btn-sm btn-danger px-3" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="main-panel">
  <!-- Filter Bar -->
  <div class="card mb-3">
    <div class="card-body py-2">
      <div class="row g-2 align-items-end">
        <div class="col-md-4">
          <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Search company, contact, mobile…">
        </div>
        <div class="col-md-3">
          <select class="form-select form-select-sm" id="filterStatus">
            <option value="">All Statuses</option>
            <option>New</option><option>Contacted</option><option>Qualified</option>
            <option>Proposal Sent</option><option>Negotiation</option><option>Won</option><option>Lost</option>
          </select>
        </div>
        <div class="col-auto">
          <button class="btn btn-sm btn-outline-secondary" onclick="loadLeads()"><i class="bi bi-search"></i> Search</button>
        </div>
        <div class="col-auto ms-auto">
          <button class="btn btn-sm btn-warning" onclick="openModal()"><i class="bi bi-plus-circle me-1"></i>New Lead</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card card-table">
    <div class="card-header d-flex justify-content-between align-items-center py-3">
      <span class="fw-semibold">All Leads</span>
      <span class="small text-muted" id="totalLabel"></span>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead><tr>
            <th>Lead No</th><th>Company</th><th>Contact</th><th>Mobile</th>
            <th>Source</th><th>Owner</th><th>Priority</th><th>Status</th>
            <th>Expected (₹)</th><th>Next Follow-up</th><th>Actions</th>
          </tr></thead>
          <tbody id="leadTbody"><tr><td colspan="11" class="text-center py-3 text-muted">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
    <div class="card-footer d-flex justify-content-between align-items-center py-2">
      <button class="btn btn-sm btn-outline-secondary" id="prevBtn" onclick="changePage(-1)">« Prev</button>
      <span class="small" id="pageInfo">Page 1</span>
      <button class="btn btn-sm btn-outline-secondary" id="nextBtn" onclick="changePage(1)">Next »</button>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal fade" id="leadModal" tabindex="-1">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="modalTitle">New Lead</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <form id="leadForm" class="row g-3">
          <input type="hidden" id="leadId">
          <div class="col-md-6"><label class="form-label">Company Name *</label><input type="text" class="form-control" id="fCompanyName" required></div>
          <div class="col-md-6"><label class="form-label">Contact Person *</label><input type="text" class="form-control" id="fContactPerson" required></div>
          <div class="col-md-4"><label class="form-label">Mobile *</label><input type="tel" class="form-control" id="fMobile" required pattern="[0-9]{10,15}"></div>
          <div class="col-md-4"><label class="form-label">Email</label><input type="email" class="form-control" id="fEmail"></div>
          <div class="col-md-4"><label class="form-label">City</label><input type="text" class="form-control" id="fCity"></div>
          <div class="col-md-4"><label class="form-label">State</label><input type="text" class="form-control" id="fState"></div>
          <div class="col-md-4"><label class="form-label">Country</label><input type="text" class="form-control" id="fCountry" value="India"></div>
          <div class="col-md-4"><label class="form-label">Industry</label>
            <select class="form-select" id="fIndustry">
              <option value="">Select…</option>
              <option>IT / Software</option><option>Manufacturing</option><option>Retail</option>
              <option>Healthcare</option><option>Finance</option><option>Education</option>
              <option>Real Estate</option><option>Logistics</option><option>Other</option>
            </select>
          </div>
          <div class="col-md-4"><label class="form-label">Lead Source</label>
            <select class="form-select" id="fLeadSource">
              <option value="">Select…</option>
              <option>Website</option><option>Referral</option><option>Cold Call</option>
              <option>Exhibition</option><option>Social Media</option><option>Email Campaign</option><option>Other</option>
            </select>
          </div>
          <div class="col-md-4"><label class="form-label">Priority</label>
            <select class="form-select" id="fPriority">
              <option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option>
            </select>
          </div>
          <div class="col-md-4"><label class="form-label">Status</label>
            <select class="form-select" id="fStatus">
              <option selected>New</option><option>Contacted</option><option>Qualified</option>
              <option>Proposal Sent</option><option>Negotiation</option><option>Won</option><option>Lost</option>
            </select>
          </div>
          <div class="col-md-4"><label class="form-label">Expected Value (₹)</label><input type="number" class="form-control" id="fExpectedValue" min="0"></div>
          <div class="col-md-4"><label class="form-label">Next Follow-up Date</label><input type="date" class="form-control" id="fNextFollowUp"></div>
          <div class="col-12"><label class="form-label">Address</label><textarea class="form-control" id="fAddress" rows="2"></textarea></div>
          <div class="col-12"><label class="form-label">Remarks</label><textarea class="form-control" id="fRemarks" rows="2"></textarea></div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-warning" onclick="saveLead()">Save Lead</button>
      </div>
    </div>
  </div>
</div>

<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
const role = sessionStorage.getItem('hrms_role') || localStorage.getItem('hrms_role');
const name = sessionStorage.getItem('hrms_name') || localStorage.getItem('hrms_name') || 'User';
if (!role) window.location.replace('/login.html');
document.getElementById('navUserName').textContent = name;
document.getElementById('navAvatar').textContent   = name.charAt(0).toUpperCase();

let modal, currentPage = 1, totalItems = 0;
const PAGE_SIZE = 20;

const STATUS_BADGE = {
  'New':'primary','Contacted':'info','Qualified':'warning',
  'Proposal Sent':'secondary','Negotiation':'danger','Won':'success','Lost':'dark'
};
const PRIORITY_BADGE = { 'Low':'secondary','Medium':'warning','High':'danger','Critical':'dark' };

function openModal(lead) {
  document.getElementById('modalTitle').textContent = lead ? 'Edit Lead' : 'New Lead';
  document.getElementById('leadId').value            = lead ? lead.id : '';
  document.getElementById('fCompanyName').value      = lead?.companyName ?? '';
  document.getElementById('fContactPerson').value    = lead?.contactPerson ?? '';
  document.getElementById('fMobile').value           = lead?.mobile ?? '';
  document.getElementById('fEmail').value            = lead?.email ?? '';
  document.getElementById('fCity').value             = lead?.city ?? '';
  document.getElementById('fState').value            = lead?.state ?? '';
  document.getElementById('fCountry').value          = lead?.country ?? 'India';
  document.getElementById('fIndustry').value         = lead?.industry ?? '';
  document.getElementById('fLeadSource').value       = lead?.leadSource ?? '';
  document.getElementById('fPriority').value         = lead?.priority ?? 'Medium';
  document.getElementById('fStatus').value           = lead?.status ?? 'New';
  document.getElementById('fExpectedValue').value    = lead?.expectedValue ?? '';
  document.getElementById('fNextFollowUp').value     = lead?.nextFollowUpDate ? lead.nextFollowUpDate.substring(0,10) : '';
  document.getElementById('fAddress').value          = lead?.address ?? '';
  document.getElementById('fRemarks').value          = lead?.remarks ?? '';
  modal.show();
}

async function saveLead() {
  const form = document.getElementById('leadForm');
  if (!form.checkValidity()) { form.reportValidity(); return; }
  const id  = document.getElementById('leadId').value;
  const dto = {
    companyName: document.getElementById('fCompanyName').value.trim(),
    contactPerson: document.getElementById('fContactPerson').value.trim(),
    mobile: document.getElementById('fMobile').value.trim(),
    email: document.getElementById('fEmail').value.trim(),
    city: document.getElementById('fCity').value.trim(),
    state: document.getElementById('fState').value.trim(),
    country: document.getElementById('fCountry').value.trim(),
    industry: document.getElementById('fIndustry').value,
    leadSource: document.getElementById('fLeadSource').value,
    priority: document.getElementById('fPriority').value,
    status: document.getElementById('fStatus').value,
    expectedValue: document.getElementById('fExpectedValue').value || null,
    nextFollowUpDate: document.getElementById('fNextFollowUp').value || null,
    address: document.getElementById('fAddress').value.trim(),
    remarks: document.getElementById('fRemarks').value.trim(),
  };
  const res = id ? await HrmsApi.updateLead(id, dto) : await HrmsApi.createLead(dto);
  if (res && res.success) { modal.hide(); loadLeads(); }
  else alert((res && res.message) || 'Save failed.');
}

async function deleteLead(id) {
  if (!confirm('Delete this lead?')) return;
  const res = await HrmsApi.deleteLead(id);
  if (res && res.success) loadLeads();
  else alert((res && res.message) || 'Delete failed.');
}

async function changeStatus(id, status) {
  const res = await HrmsApi.updateLeadStatus(id, status);
  if (res && res.success) loadLeads();
  else alert((res && res.message) || 'Failed.');
}

function changePage(dir) {
  const pages = Math.ceil(totalItems / PAGE_SIZE);
  currentPage = Math.max(1, Math.min(pages || 1, currentPage + dir));
  loadLeads();
}

async function loadLeads() {
  const tbody  = document.getElementById('leadTbody');
  tbody.innerHTML = '<tr><td colspan="11" class="text-center py-3"><span class="spinner-border spinner-border-sm me-2"></span>Loading…</td></tr>';
  const search = document.getElementById('searchInput').value.trim();
  const status = document.getElementById('filterStatus').value;
  const res = await HrmsApi.listLeads(currentPage, PAGE_SIZE, status || null, search || null);
  if (!res || !res.success) { tbody.innerHTML = '<tr><td colspan="11" class="text-center text-danger py-3">Failed to load.</td></tr>'; return; }
  totalItems = res.total;
  document.getElementById('totalLabel').textContent = `${res.total} leads`;
  document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${Math.ceil(res.total / PAGE_SIZE) || 1}`;
  document.getElementById('prevBtn').disabled = currentPage <= 1;
  document.getElementById('nextBtn').disabled = currentPage >= Math.ceil(res.total / PAGE_SIZE);
  if (!res.data.length) { tbody.innerHTML = '<tr><td colspan="11" class="text-center py-3 text-muted">No leads found.</td></tr>'; return; }
  tbody.innerHTML = res.data.map(l => `<tr>
    <td><a href="sales-leads.html?id=${l.id}" class="fw-semibold text-decoration-none">${l.leadNo}</a></td>
    <td>${l.companyName}</td><td>${l.contactPerson}</td><td>${l.mobile}</td>
    <td>${l.leadSource||'—'}</td><td>${l.ownerName||'—'}</td>
    <td><span class="badge bg-${PRIORITY_BADGE[l.priority]||'secondary'}">${l.priority}</span></td>
    <td><span class="badge bg-${STATUS_BADGE[l.status]||'secondary'}">${l.status}</span></td>
    <td>${l.expectedValue ? '₹'+Number(l.expectedValue).toLocaleString('en-IN') : '—'}</td>
    <td>${l.nextFollowUpDate ? l.nextFollowUpDate.substring(0,10) : '—'}</td>
    <td class="text-nowrap">
      <button class="btn btn-xs btn-outline-warning py-0 px-1 me-1" title="Edit" onclick='openModal(${JSON.stringify(l).replace(/"/g,"&quot;")})'><i class="bi bi-pencil"></i></button>
      <div class="btn-group">
        <button class="btn btn-xs btn-outline-secondary py-0 px-1 dropdown-toggle" data-bs-toggle="dropdown"></button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" onclick="changeStatus(${l.id},'Contacted')">Mark Contacted</a></li>
          <li><a class="dropdown-item" onclick="changeStatus(${l.id},'Qualified')">Mark Qualified</a></li>
          <li><a class="dropdown-item" onclick="changeStatus(${l.id},'Proposal Sent')">Proposal Sent</a></li>
          <li><a class="dropdown-item" onclick="changeStatus(${l.id},'Negotiation')">Negotiation</a></li>
          <li><a class="dropdown-item text-success" onclick="changeStatus(${l.id},'Won')">Won ✓</a></li>
          <li><a class="dropdown-item text-danger" onclick="changeStatus(${l.id},'Lost')">Lost</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item" href="sales-followups.html?leadId=${l.id}">Add Follow-up</a></li>
          <li><a class="dropdown-item" href="sales-meetings.html?leadId=${l.id}">Schedule Meeting</a></li>
          <li><a class="dropdown-item" href="sales-quotations.html?leadId=${l.id}">New Quotation</a></li>
          <li><a class="dropdown-item text-success" href="sales-customers.html?convertLead=${l.id}">Convert to Customer</a></li>
        </ul>
      </div>
      <button class="btn btn-xs btn-outline-danger py-0 px-1 ms-1" title="Delete" onclick="deleteLead(${l.id})"><i class="bi bi-trash"></i></button>
    </td>
  </tr>`).join('');
}

modal = new bootstrap.Modal(document.getElementById('leadModal'));
loadLeads();
</script>
</body>
</html>
