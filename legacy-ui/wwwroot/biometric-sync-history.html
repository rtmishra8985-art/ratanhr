<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <title>Biometric Sync History – RatanHR</title>
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/hrms.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/theme.css">
  <script src="/js/theme.js"></script>
</head>
<body>

<nav class="sidebar" id="sidebar">
  <div class="brand"><img src="assets/img/ratanhr-logo.png" alt="RatanHR" class="brand-logo"> RatanHR</div>
  <div class="mt-2">
    <div class="nav-label">Main</div>
    <a href="admin-dashboard.html" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <div class="nav-label">Biometric</div>
    <a class="nav-link" href="biometric-dashboard.html"><i class="bi bi-fingerprint"></i> Biometric Dashboard</a>
    <a class="nav-link" href="biometric-devices.html"><i class="bi bi-hdd-network"></i> Devices</a>
    <a class="nav-link" href="biometric-logs.html"><i class="bi bi-list-ul"></i> Punch Logs</a>
    <a class="nav-link" href="biometric-realtime.html"><i class="bi bi-broadcast"></i> Realtime Monitor</a>
    <a class="nav-link active" href="biometric-sync-history.html"><i class="bi bi-arrow-repeat"></i> Sync History</a>
    <a class="nav-link" href="biometric-settings.html"><i class="bi bi-gear"></i> Settings</a>
  </div>
  <button id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme">🌙</button>
</nav>

<nav class="topnav">
  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-sm d-md-none" onclick="document.getElementById('sidebar').classList.toggle('show')"><i class="bi bi-list fs-5"></i></button>
    <h6 class="mb-0 fw-semibold">Sync History</h6>
  </div>
  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-sm btn-outline-primary" onclick="loadHistory(1)"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
    <button class="btn btn-sm btn-danger px-3" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="main-panel">
  <div class="card">
    <div class="card-header fw-semibold d-flex justify-content-between">
      <span><i class="bi bi-arrow-repeat me-2"></i>Biometric Sync History</span>
      <span class="badge bg-secondary" id="totalBadge">–</span>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th>Started</th><th>Device</th><th>Vendor</th><th>Range</th>
              <th>Fetched</th><th>Created</th><th>Updated</th><th>Skipped</th>
              <th>Duration</th><th>Trigger</th><th>Result</th>
            </tr>
          </thead>
          <tbody id="historyBody">
            <tr><td colspan="11" class="text-center py-4 text-muted">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="card-footer d-flex justify-content-between align-items-center">
      <small class="text-muted" id="pageInfo"></small>
      <div class="d-flex gap-2">
        <button class="btn btn-sm btn-outline-secondary" id="btnPrev" onclick="changePage(-1)">‹ Prev</button>
        <button class="btn btn-sm btn-outline-secondary" id="btnNext" onclick="changePage(1)">Next ›</button>
      </div>
    </div>
  </div>
</div>

<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
let currentPage = 1, totalPages = 1;

async function loadHistory(page = 1) {
  currentPage = page;
  const tbody = document.getElementById('historyBody');
  tbody.innerHTML = '<tr><td colspan="11" class="text-center py-3"><span class="spinner-border spinner-border-sm"></span></td></tr>';
  const r = await fetch(`/api/biometric/sync/history?page=${page}&pageSize=30`, { credentials: 'include' });
  const d = await r.json();

  if (!d.success) {
    tbody.innerHTML = `<tr><td colspan="11" class="text-center text-danger py-4">${d.message}</td></tr>`;
    return;
  }
  const pr = d.data;
  document.getElementById('totalBadge').textContent = pr.total + ' records';
  totalPages = Math.ceil(pr.total / 30);
  document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
  document.getElementById('btnPrev').disabled = currentPage <= 1;
  document.getElementById('btnNext').disabled = currentPage >= totalPages;

  if (!pr.items?.length) {
    tbody.innerHTML = '<tr><td colspan="11" class="text-center text-muted py-4">No sync history yet.</td></tr>';
    return;
  }

  tbody.innerHTML = pr.items.map(h => `
    <tr>
      <td class="small">${new Date(h.startedAt).toLocaleString()}</td>
      <td>${h.deviceName || '<em class="text-muted">All</em>'}</td>
      <td><span class="badge bg-secondary">${h.vendorName}</span></td>
      <td class="small text-muted">${new Date(h.rangeFrom).toLocaleDateString()} – ${new Date(h.rangeTo).toLocaleDateString()}</td>
      <td>${h.totalFetched}</td>
      <td class="text-success fw-semibold">${h.recordsCreated}</td>
      <td class="text-primary">${h.recordsUpdated}</td>
      <td class="text-warning">${h.recordsSkipped}</td>
      <td class="small text-muted">${h.durationSeconds != null ? h.durationSeconds.toFixed(1)+'s' : '–'}</td>
      <td>${h.isAutomatic
        ? '<span class="badge bg-info text-dark">Auto</span>'
        : '<span class="badge bg-light text-dark border">Manual</span>'}</td>
      <td>${h.isSuccess
        ? '<span class="badge bg-success">Success</span>'
        : `<span class="badge bg-danger" title="${h.errorMessage||''}">Failed</span>`}</td>
    </tr>`).join('');
}

function changePage(dir) {
  const p = currentPage + dir;
  if (p >= 1 && p <= totalPages) loadHistory(p);
}


loadHistory(1);
</script>
</body>
</html>
