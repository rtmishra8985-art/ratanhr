<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <title>Edit Company – RatanHR</title>
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/hrms.css" rel="stylesheet">

  <!-- Theme system -->
  <link rel="stylesheet" href="/css/theme.css">
  <script src="/js/theme.js"></script>
</head>
<body>
<nav class="sidebar" id="sidebar">
  <div class="brand"><img src="assets/img/ratanhr-logo.png" alt="RatanHR" class="brand-logo"> RatanHR</div>
  <div class="mt-2">
    <div class="nav-label">Main</div>
    <a href="admin-dashboard.html" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <div class="nav-label">Company</div>
    <a class="nav-link" data-bs-toggle="collapse" href="#collapseCompany"><i class="bi bi-building"></i> Company <i class="bi bi-chevron-down ms-auto small"></i></a>
    <div class="collapse show" id="collapseCompany">
      <a href="add-company.html" class="sub-link">Add</a>
      <a href="view-company.html" class="sub-link" style="color:#f7b731;">View / Edit</a>
    </div>
    <div class="nav-label">Payroll</div>
    <a class="nav-link" data-bs-toggle="collapse" href="#collapsePayroll"><i class="bi bi-cash-stack"></i> Payroll <i class="bi bi-chevron-down ms-auto small"></i></a>
    <div class="collapse" id="collapsePayroll">
      <a href="payroll.html" class="sub-link">View Payroll</a>
      <a href="add-payroll.html" class="sub-link">Generate Payslip</a>
    </div>
    <div class="nav-label">Reports</div>
    <a class="nav-link" data-bs-toggle="collapse" href="#collapseReports"><i class="bi bi-bar-chart-line"></i> Reports <i class="bi bi-chevron-down ms-auto small"></i></a>
    <div class="collapse" id="collapseReports">
      <a href="reports-attendance.html" class="sub-link">Attendance Report</a>
      <a href="reports-employee.html" class="sub-link">Employee Report</a>
    </div>
    <a href="admin-users.html" class="nav-link"><i class="bi bi-people"></i> Admin Users</a>
  </div>

  <button id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme">🌙</button>
</nav>
<nav class="topnav">
  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-sm d-md-none" onclick="document.getElementById('sidebar').classList.toggle('show')"><i class="bi bi-list fs-5"></i></button>
    <h6 class="mb-0 fw-semibold">Edit Company Details</h6>
  </div>
  <div class="d-flex align-items-center gap-3">
    <div class="avatar-circle" id="navAvatar">?</div>
    <button class="btn btn-sm btn-danger px-3" onclick="logout()">Logout</button>
  </div>
</nav>
<div class="main-panel">
  <!-- BACKEND: Pre-fill from {{company}}. POST to /update-company -->
  <form action="/update-company" method="POST">
    <input type="hidden" name="userId" value="{{company.user_id}}">
    <div class="card card-table mb-4">
      <div class="card-header py-3"><p class="section-title mb-0">Company Information</p></div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label fw-semibold small">Company Name</label><input class="form-control" name="company_name" value="{{company.company_name}}" required></div>
          <div class="col-md-6"><label class="form-label fw-semibold small">Founder Name</label><input class="form-control" name="company_founder_name" value="{{company.company_founder_name}}"></div>
          <div class="col-md-4"><label class="form-label fw-semibold small">Phone</label><input class="form-control" name="phone_number" value="{{company.phone_number}}"></div>
          <div class="col-md-4"><label class="form-label fw-semibold small">Email</label><input type="email" class="form-control" name="email_address" value="{{company.email_address}}"></div>
          <div class="col-md-4"><label class="form-label fw-semibold small">Industry Type</label><input class="form-control" name="industry_type" value="{{company.industry_type}}"></div>
          <div class="col-md-4"><label class="form-label fw-semibold small">Business Type</label><input class="form-control" name="business_type" value="{{company.business_type}}"></div>
          <div class="col-md-4"><label class="form-label fw-semibold small">CIN</label><input class="form-control" name="CIN" value="{{company.CIN}}"></div>
          <div class="col-md-4"><label class="form-label fw-semibold small">TIN</label><input class="form-control" name="TIN" value="{{company.TIN}}"></div>
          <div class="col-md-6"><label class="form-label fw-semibold small">PAN</label><input class="form-control" name="pan" value="{{company.pan}}"></div>
          <div class="col-md-6"><label class="form-label fw-semibold small">TAN</label><input class="form-control" name="tan" value="{{company.tan}}"></div>
        </div>
      </div>
    </div>
    <div class="card card-table mb-4">
      <div class="card-header py-3"><p class="section-title mb-0">Address</p></div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label fw-semibold small">Address Line 1</label><input class="form-control" name="address_line1" value="{{company.address_line1}}"></div>
          <div class="col-md-6"><label class="form-label fw-semibold small">Address Line 2</label><input class="form-control" name="address_line2" value="{{company.address_line2}}"></div>
          <div class="col-md-3"><label class="form-label fw-semibold small">City</label><input class="form-control" name="city" value="{{company.city}}"></div>
          <div class="col-md-3"><label class="form-label fw-semibold small">State</label><input class="form-control" name="state_province" value="{{company.state_province}}"></div>
          <div class="col-md-3"><label class="form-label fw-semibold small">Country</label><input class="form-control" name="country" value="{{company.country}}"></div>
          <div class="col-md-3"><label class="form-label fw-semibold small">Postal Code</label><input class="form-control" name="postal_code" value="{{company.postal_code}}"></div>
        </div>
      </div>
    </div>
    <div class="text-center pb-4">
      <button type="submit" class="btn btn-warning fw-bold px-5 py-2"><i class="bi bi-save me-2"></i>Update Company</button>
      <a href="view-company.html" class="btn btn-outline-secondary ms-3 px-4 py-2">Cancel</a>
    </div>
  </form>
</div>
<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
