<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <title>Forgot Password – RatanHR</title>
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/hrms.css" rel="stylesheet">

  <!-- Theme system -->
  <link rel="stylesheet" href="/css/theme.css">
  <script src="/js/theme.js"></script>
</head>
<body>
<div class="login-wrapper">
  <div class="login-card card">
    <div class="card-body">
      <div class="text-center mb-4">
        <div class="mb-3" style="font-size:48px;">🔑</div>
        <h4 class="fw-bold">Forgot Password?</h4>
        <p class="text-muted small">Enter your registered email. If it matches an account, we'll send reset instructions.</p>
      </div>

      <div id="alertBox" class="alert d-none py-2 small"></div>

      <form id="forgotForm">
        <div class="mb-3">
          <label class="form-label fw-semibold small">Registered Email</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
          </div>
        </div>
        <div class="d-grid mb-3">
          <button type="submit" class="btn btn-login btn-lg" id="submitBtn">SEND RESET LINK</button>
        </div>
        <div class="text-center">
          <a href="login.html" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left"></i> Back to Login</a>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="js/api.js"></script>
<script>
  document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const box = document.getElementById('alertBox');
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    try {
      const res = await fetch('/api/auth/forgot-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value.trim() })
      });
      const data = await res.json();
      box.className = 'alert alert-success py-2 small';
      box.textContent = data.message || 'If that email is registered, a password reset link has been sent.';
      document.getElementById('forgotForm').reset();
    } catch {
      box.className = 'alert alert-danger py-2 small';
      box.textContent = 'Cannot connect to server. Please try again.';
    } finally {
      btn.disabled = false;
    }
  });
</script>
<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
