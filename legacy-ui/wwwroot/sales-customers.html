<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers – RatanHR</title>
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/hrms.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/theme.css">
  <script src="/js/theme.js"></script>
</head>
<body>
<nav class="sidebar" id="sidebar">
  <div class="brand"><img src="assets/img/ratanhr-logo.png" alt="RatanHR" class="brand-logo"> RatanHR</div>
  <div class="mt-2">
    <div class="nav-label">Main</div>
    <a href="admin-dashboard.html" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <div class="nav-label">Sales</div>
    <a class="nav-link active" data-bs-toggle="collapse" href="#collapseSales"><i class="bi bi-graph-up-arrow"></i> Sales <i class="bi bi-chevron-down ms-auto small"></i></a>
    <div class="collapse show" id="collapseSales">
      <a href="sales-dashboard.html" class="sub-link">Dashboard</a>
      <a href="sales-leads.html" class="sub-link">Leads</a>
      <a href="sales-customers.html" class="sub-link" style="color:#f7b731;">Customers</a>
      <a href="sales-followups.html" class="sub-link">Follow Ups</a>
      <a href="sales-meetings.html" class="sub-link">Meetings</a>
      <a href="sales-visits.html" class="sub-link">Field Visits</a>
      <a href="sales-quotations.html" class="sub-link">Quotations</a>
      <a href="sales-tasks.html" class="sub-link">Tasks</a>
      <a href="sales-reports.html" class="sub-link">Reports</a>
    </div>
  </div>
  <button id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme">🌙</button>
</nav>
<nav class="topnav">
  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-sm d-md-none" onclick="document.getElementById('sidebar').classList.toggle('show')"><i class="bi bi-list fs-5"></i></button>
    <h6 class="mb-0 fw-semibold">Customers</h6>
  </div>
  <div class="d-flex align-items-center gap-3">
    <span class="small text-muted" id="navUserName"></span>
    <div class="avatar-circle" id="navAvatar">?</div>
    <button class="btn btn-sm btn-danger px-3" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="main-panel">
  <div class="card mb-3">
    <div class="card-body py-2">
      <div class="row g-2 align-items-end">
        <div class="col-md-5"><input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Search company, contact, phone…"></div>
        <div class="col-auto"><button class="btn btn-sm btn-outline-secondary" onclick="loadCustomers()"><i class="bi bi-search"></i> Search</button></div>
        <div class="col-auto ms-auto"><button class="btn btn-sm btn-warning" onclick="openModal()"><i class="bi bi-plus-circle me-1"></i>New Customer</button></div>
      </div>
    </div>
  </div>

  <div class="card card-table">
    <div class="card-header d-flex justify-content-between align-items-center py-3">
      <span class="fw-semibold">All Customers</span>
      <span class="small text-muted" id="totalLabel"></span>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead><tr>
            <th>Code</th><th>Company</th><th>Contact</th><th>Phone</th>
            <th>Email</th><th>Sales Person</th><th>Status</th><th>Created</th><th>Actions</th>
          </tr></thead>
          <tbody id="custTbody"><tr><td colspan="9" class="text-center py-3 text-muted">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
    <div class="card-footer d-flex justify-content-between align-items-center py-2">
      <button class="btn btn-sm btn-outline-secondary" id="prevBtn" onclick="changePage(-1)">« Prev</button>
      <span class="small" id="pageInfo">Page 1</span>
      <button class="btn btn-sm btn-outline-secondary" id="nextBtn" onclick="changePage(1)">Next »</button>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal fade" id="custModal" tabindex="-1">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="modalTitle">New Customer</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <form id="custForm" class="row g-3">
          <input type="hidden" id="custId">
          <div class="col-md-6"><label class="form-label">Company Name *</label><input type="text" class="form-control" id="fCompanyName" required></div>
          <div class="col-md-3"><label class="form-label">GST No.</label><input type="text" class="form-control" id="fGst" pattern="^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z]{1}[1-9A-Z]{1}Z[0-9A-Z]{1}$|^$" title="Valid GST format required"></div>
          <div class="col-md-3"><label class="form-label">PAN No.</label><input type="text" class="form-control" id="fPan" pattern="^[A-Z]{5}[0-9]{4}[A-Z]{1}$|^$" title="Valid PAN format required"></div>
          <div class="col-md-4"><label class="form-label">Contact Person</label><input type="text" class="form-control" id="fContactPerson"></div>
          <div class="col-md-4"><label class="form-label">Contact Phone</label><input type="tel" class="form-control" id="fContactPhone" pattern="[0-9]{10,15}"></div>
          <div class="col-md-4"><label class="form-label">Contact Email</label><input type="email" class="form-control" id="fContactEmail"></div>
          <div class="col-12"><label class="form-label">Billing Address</label><textarea class="form-control" id="fBillingAddress" rows="2"></textarea></div>
          <div class="col-12"><label class="form-label">Shipping Address <small class="text-muted">(leave blank to copy billing)</small></label><textarea class="form-control" id="fShippingAddress" rows="2"></textarea></div>
          <div class="col-md-6"><label class="form-label">Assigned Sales Person (Employee ID)</label><input type="text" class="form-control" id="fSalesPerson"></div>
          <div class="col-md-3"><label class="form-label">Status</label>
            <select class="form-select" id="fIsActive">
              <option value="true">Active</option><option value="false">Inactive</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-warning" onclick="saveCustomer()">Save Customer</button>
      </div>
    </div>
  </div>
</div>

<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
const role = sessionStorage.getItem('hrms_role') || localStorage.getItem('hrms_role');
const name = sessionStorage.getItem('hrms_name') || localStorage.getItem('hrms_name') || 'User';
if (!role) window.location.replace('/login.html');
document.getElementById('navUserName').textContent = name;
document.getElementById('navAvatar').textContent   = name.charAt(0).toUpperCase();

// Handle convert lead from URL params
const urlP = new URLSearchParams(window.location.search);
const convertLeadId = urlP.get('convertLead');
if (convertLeadId) {
  window.addEventListener('DOMContentLoaded', () => openConvertModal(convertLeadId));
}

let modal, currentPage = 1, totalItems = 0;
const PAGE_SIZE = 20;

function openModal(c) {
  document.getElementById('modalTitle').textContent     = c ? 'Edit Customer' : 'New Customer';
  document.getElementById('custId').value               = c ? c.id : '';
  document.getElementById('fCompanyName').value         = c?.companyName ?? '';
  document.getElementById('fGst').value                 = c?.gst ?? '';
  document.getElementById('fPan').value                 = c?.pan ?? '';
  document.getElementById('fContactPerson').value       = c?.contactPerson ?? '';
  document.getElementById('fContactPhone').value        = c?.contactPhone ?? '';
  document.getElementById('fContactEmail').value        = c?.contactEmail ?? '';
  document.getElementById('fBillingAddress').value      = c?.billingAddress ?? '';
  document.getElementById('fShippingAddress').value     = c?.shippingAddress ?? '';
  document.getElementById('fSalesPerson').value         = c?.assignedSalesPersonId ?? '';
  document.getElementById('fIsActive').value            = c ? String(c.isActive) : 'true';
  modal.show();
}

async function openConvertModal(leadId) {
  const res = await HrmsApi.getLead(leadId);
  if (!res || !res.success) return;
  const l = res.data;
  openModal(null);
  document.getElementById('modalTitle').textContent = `Convert Lead: ${l.companyName}`;
  document.getElementById('fCompanyName').value    = l.companyName;
  document.getElementById('fContactPerson').value  = l.contactPerson;
  document.getElementById('fContactPhone').value   = l.mobile;
  document.getElementById('fContactEmail').value   = l.email;
  const origSave = saveCustomer;
  document.querySelector('#custModal .btn-warning').onclick = async () => {
    const dto = buildDto();
    const r = await HrmsApi.convertLead(leadId, dto);
    if (r && r.success) { modal.hide(); loadCustomers(); }
    else alert((r && r.message) || 'Convert failed.');
  };
}

function buildDto() {
  return {
    companyName: document.getElementById('fCompanyName').value.trim(),
    gst: document.getElementById('fGst').value.trim(),
    pan: document.getElementById('fPan').value.trim(),
    contactPerson: document.getElementById('fContactPerson').value.trim(),
    contactPhone: document.getElementById('fContactPhone').value.trim(),
    contactEmail: document.getElementById('fContactEmail').value.trim(),
    billingAddress: document.getElementById('fBillingAddress').value.trim(),
    shippingAddress: document.getElementById('fShippingAddress').value.trim() || document.getElementById('fBillingAddress').value.trim(),
    assignedSalesPersonId: document.getElementById('fSalesPerson').value.trim() || null,
    isActive: document.getElementById('fIsActive').value === 'true',
  };
}

async function saveCustomer() {
  const form = document.getElementById('custForm');
  if (!form.checkValidity()) { form.reportValidity(); return; }
  const id  = document.getElementById('custId').value;
  const dto = buildDto();
  const res = id ? await HrmsApi.updateCustomer(id, dto) : await HrmsApi.createCustomer(dto);
  if (res && res.success) { modal.hide(); loadCustomers(); }
  else alert((res && res.message) || 'Save failed.');
}

async function deleteCustomer(id) {
  if (!confirm('Delete this customer?')) return;
  const res = await HrmsApi.deleteCustomer(id);
  if (res && res.success) loadCustomers();
  else alert((res && res.message) || 'Delete failed.');
}

function changePage(dir) {
  const pages = Math.ceil(totalItems / PAGE_SIZE);
  currentPage = Math.max(1, Math.min(pages || 1, currentPage + dir));
  loadCustomers();
}

async function loadCustomers() {
  const tbody = document.getElementById('custTbody');
  tbody.innerHTML = '<tr><td colspan="9" class="text-center py-3"><span class="spinner-border spinner-border-sm me-2"></span>Loading…</td></tr>';
  const search = document.getElementById('searchInput').value.trim();
  const res = await HrmsApi.listCustomers(currentPage, PAGE_SIZE, search || null);
  if (!res || !res.success) { tbody.innerHTML = '<tr><td colspan="9" class="text-center text-danger py-3">Failed to load.</td></tr>'; return; }
  totalItems = res.total;
  document.getElementById('totalLabel').textContent = `${res.total} customers`;
  document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${Math.ceil(res.total/PAGE_SIZE)||1}`;
  document.getElementById('prevBtn').disabled = currentPage <= 1;
  document.getElementById('nextBtn').disabled = currentPage >= Math.ceil(res.total/PAGE_SIZE);
  if (!res.data.length) { tbody.innerHTML = '<tr><td colspan="9" class="text-center py-3 text-muted">No customers found.</td></tr>'; return; }
  tbody.innerHTML = res.data.map(c => `<tr>
    <td><span class="badge bg-secondary">${c.customerCode}</span></td>
    <td><strong>${c.companyName}</strong></td>
    <td>${c.contactPerson||'—'}</td><td>${c.contactPhone||'—'}</td>
    <td>${c.contactEmail||'—'}</td><td>${c.salesPersonName||'—'}</td>
    <td><span class="badge ${c.isActive?'bg-success':'bg-secondary'}">${c.isActive?'Active':'Inactive'}</span></td>
    <td>${c.createdAt.substring(0,10)}</td>
    <td class="text-nowrap">
      <button class="btn btn-xs btn-outline-warning py-0 px-1 me-1" onclick='openModal(${JSON.stringify(c).replace(/"/g,"&quot;")})'><i class="bi bi-pencil"></i></button>
      <a href="sales-meetings.html?customerId=${c.id}" class="btn btn-xs btn-outline-primary py-0 px-1 me-1" title="Meetings"><i class="bi bi-calendar-event"></i></a>
      <a href="sales-quotations.html?customerId=${c.id}" class="btn btn-xs btn-outline-info py-0 px-1 me-1" title="Quotations"><i class="bi bi-file-earmark-text"></i></a>
      <button class="btn btn-xs btn-outline-danger py-0 px-1" onclick="deleteCustomer(${c.id})"><i class="bi bi-trash"></i></button>
    </td>
  </tr>`).join('');
}

modal = new bootstrap.Modal(document.getElementById('custModal'));
loadCustomers();
</script>
</body>
</html>
