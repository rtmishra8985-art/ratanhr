<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Performance Cycles – RatanHR</title>
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/hrms.css" rel="stylesheet">

  <!-- Theme system -->
  <link rel="stylesheet" href="/css/theme.css">
  <script src="/js/theme.js"></script>
</head>
<body>
<nav class="sidebar" id="sidebar">
  <div class="brand"><img src="assets/img/ratanhr-logo.png" alt="RatanHR" class="brand-logo"> RatanHR</div>
  <div class="mt-2">
    <div class="nav-label">Performance</div>
    <a class="nav-link active" data-bs-toggle="collapse" href="#collapsePerf"><i class="bi bi-trophy"></i> Performance <i class="bi bi-chevron-down ms-auto small"></i></a>
    <div class="collapse show" id="collapsePerf">
      <a href="performance-dashboard.html" class="sub-link">Dashboard</a>
      <a href="performance-cycles.html" class="sub-link" style="color:#f7b731;">Review Cycles</a>
      <a href="performance-goals.html" class="sub-link">Goals</a>
      <a href="performance-reviews.html" class="sub-link">Reviews</a>
      <a href="performance-feedback.html" class="sub-link">Feedback</a>
    </div>
  </div>

  <button id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme">🌙</button>
</nav>
<nav class="topnav">
  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-sm d-md-none" onclick="document.getElementById('sidebar').classList.toggle('show')"><i class="bi bi-list fs-5"></i></button>
    <h6 class="mb-0 fw-semibold">Review Cycles</h6>
  </div>
  <div class="d-flex align-items-center gap-3">
    <span class="small text-muted" id="navUserName"></span>
    <div class="avatar-circle" id="navAvatar">?</div>
    <button class="btn btn-sm btn-danger px-3" onclick="logout()">Logout</button>
  </div>
</nav>
<div class="main-panel">
  <div class="card card-table">
    <div class="card-header d-flex justify-content-between align-items-center py-3">
      <span class="fw-semibold">Performance Review Cycles</span>
      <button class="btn btn-sm btn-warning" onclick="openModal()"><i class="bi bi-plus-circle me-1"></i>New Cycle</button>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead><tr><th>Name</th><th>Type</th><th>Start</th><th>End</th><th>Goals</th><th>Reviews</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="cycleTbody"><tr><td colspan="8" class="text-center py-3 text-muted">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="cycleModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="modalTitle">New Review Cycle</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body row g-3">
        <input type="hidden" id="cycleId">
        <div class="col-12"><label class="form-label">Cycle Name *</label><input type="text" class="form-control" id="cycleName" placeholder="e.g. Q4 2024 Annual Review"></div>
        <div class="col-md-6"><label class="form-label">Review Type</label>
          <select class="form-select" id="cycleType"><option>Annual</option><option>Semi-Annual</option><option>Quarterly</option><option>Project-based</option></select>
        </div>
        <div class="col-md-6"><label class="form-label">Status</label>
          <select class="form-select" id="cycleStatus"><option>Draft</option><option>Active</option><option>Closed</option></select>
        </div>
        <div class="col-md-6"><label class="form-label">Start Date *</label><input type="date" class="form-control" id="cycleStart"></div>
        <div class="col-md-6"><label class="form-label">End Date *</label><input type="date" class="form-control" id="cycleEnd"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-warning" onclick="saveCycle()">Save</button>
      </div>
    </div>
  </div>
</div>

<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
requireAuth(['admin','superadmin']);
populateTopnav();
const STATUS_BADGE = { 'Draft':'secondary','Active':'success','Closed':'dark' };
let modal;

function openModal(row) {
  document.getElementById('cycleId').value     = row ? row.id : '';
  document.getElementById('cycleName').value   = row ? row.name : '';
  document.getElementById('cycleType').value   = row ? row.reviewType : 'Annual';
  document.getElementById('cycleStatus').value = row ? row.status : 'Draft';
  document.getElementById('cycleStart').value  = row ? row.startDate.substring(0,10) : '';
  document.getElementById('cycleEnd').value    = row ? row.endDate.substring(0,10) : '';
  document.getElementById('modalTitle').textContent = row ? 'Edit Cycle' : 'New Review Cycle';
  modal.show();
}

async function saveCycle() {
  const id  = document.getElementById('cycleId').value;
  const dto = {
    name:       document.getElementById('cycleName').value,
    reviewType: document.getElementById('cycleType').value,
    status:     document.getElementById('cycleStatus').value,
    startDate:  document.getElementById('cycleStart').value,
    endDate:    document.getElementById('cycleEnd').value,
  };
  const res = id
    ? await HrmsApi.updatePerformanceCycle(id, dto)
    : await HrmsApi.createPerformanceCycle(dto);
  if (res && res.success) { modal.hide(); loadCycles(); }
  else alert((res && res.message) || 'Failed.');
}

async function deleteCycle(id) {
  if (!confirm('Delete this cycle?')) return;
  const res = await HrmsApi.deletePerformanceCycle(id);
  if (res && res.success) loadCycles();
}

async function loadCycles() {
  const tbody = document.getElementById('cycleTbody');
  tbody.innerHTML = '<tr><td colspan="8" class="text-center py-3"><span class="spinner-border spinner-border-sm me-2"></span>Loading…</td></tr>';
  const res = await HrmsApi.listPerformanceCycles();
  if (!res || !res.success || !res.data.length) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center py-3 text-muted">No cycles found.</td></tr>'; return;
  }
  tbody.innerHTML = res.data.map(c => `<tr>
    <td><strong>${c.name}</strong></td>
    <td><span class="badge bg-secondary">${c.reviewType}</span></td>
    <td>${c.startDate.substring(0,10)}</td>
    <td>${c.endDate.substring(0,10)}</td>
    <td>${c.totalGoals}</td>
    <td>${c.totalReviews}</td>
    <td><span class="badge bg-${STATUS_BADGE[c.status]||'secondary'}">${c.status}</span></td>
    <td class="text-nowrap">
      <button class="btn btn-xs btn-outline-warning py-0 px-1 me-1" onclick='openModal(${JSON.stringify(c)})'><i class="bi bi-pencil"></i></button>
      <button class="btn btn-xs btn-outline-danger py-0 px-1" onclick="deleteCycle(${c.id})"><i class="bi bi-trash"></i></button>
    </td>
  </tr>`).join('');
}

modal = new bootstrap.Modal(document.getElementById('cycleModal'));
loadCycles();
</script>
</body>
</html>
