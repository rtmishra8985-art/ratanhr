<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interviews – RatanHR</title>
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/hrms.css" rel="stylesheet">

  <!-- Theme system -->
  <link rel="stylesheet" href="/css/theme.css">
  <script src="/js/theme.js"></script>
</head>
<body>
<nav class="sidebar" id="sidebar">
  <div class="brand"><img src="assets/img/ratanhr-logo.png" alt="RatanHR" class="brand-logo"> RatanHR</div>
  <div class="mt-2">
    <div class="nav-label">Recruitment</div>
    <a class="nav-link active" data-bs-toggle="collapse" href="#collapseRecruit"><i class="bi bi-briefcase"></i> Recruitment <i class="bi bi-chevron-down ms-auto small"></i></a>
    <div class="collapse show" id="collapseRecruit">
      <a href="recruitment-dashboard.html" class="sub-link">Dashboard</a>
      <a href="recruitment-requisitions.html" class="sub-link">Job Openings</a>
      <a href="recruitment-candidates.html" class="sub-link">Candidates</a>
      <a href="recruitment-interviews.html" class="sub-link" style="color:#f7b731;">Interviews</a>
      <a href="recruitment-offers.html" class="sub-link">Offer Letters</a>
    </div>
  </div>

  <button id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme">🌙</button>
</nav>
<nav class="topnav">
  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-sm d-md-none" onclick="document.getElementById('sidebar').classList.toggle('show')"><i class="bi bi-list fs-5"></i></button>
    <h6 class="mb-0 fw-semibold">Interview Schedule</h6>
  </div>
  <div class="d-flex align-items-center gap-3">
    <span class="small text-muted" id="navUserName"></span>
    <div class="avatar-circle" id="navAvatar">?</div>
    <button class="btn btn-sm btn-danger px-3" onclick="logout()">Logout</button>
  </div>
</nav>
<div class="main-panel">
  <div class="card card-table">
    <div class="card-header d-flex justify-content-between align-items-center py-3">
      <span class="fw-semibold">All Interviews</span>
      <button class="btn btn-sm btn-warning" onclick="openScheduleModal()"><i class="bi bi-calendar-plus me-1"></i>Schedule Interview</button>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead><tr><th>Candidate</th><th>Type</th><th>Scheduled At</th><th>Venue</th><th>Interviewers</th><th>Score</th><th>Recommendation</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="itvTbody"><tr><td colspan="9" class="text-center py-3 text-muted">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Schedule Modal -->
<div class="modal fade" id="scheduleModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Schedule Interview</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body row g-3">
        <div class="col-12"><label class="form-label">Candidate *</label><select class="form-select" id="iCandId"><option value="">Select Candidate</option></select></div>
        <div class="col-md-6"><label class="form-label">Date & Time *</label><input type="datetime-local" class="form-control" id="iScheduledAt"></div>
        <div class="col-md-6"><label class="form-label">Interview Type</label>
          <select class="form-select" id="iType"><option>Technical</option><option>HR</option><option>Managerial</option><option>Final</option></select>
        </div>
        <div class="col-12"><label class="form-label">Venue / Meeting Link</label><input type="text" class="form-control" id="iVenue"></div>
        <div class="col-12"><label class="form-label">Interviewer Names</label><input type="text" class="form-control" id="iInterviewers" placeholder="Comma-separated names"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-warning" onclick="scheduleInterview()">Schedule</button>
      </div>
    </div>
  </div>
</div>

<!-- Feedback Modal -->
<div class="modal fade" id="feedbackModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Submit Interview Feedback</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body row g-3">
        <input type="hidden" id="fbItvId">
        <div class="col-md-6"><label class="form-label">Score (1–10)</label><input type="number" class="form-control" id="fbScore" min="1" max="10"></div>
        <div class="col-md-6"><label class="form-label">Recommendation</label>
          <select class="form-select" id="fbRec"><option>Proceed</option><option>Offer</option><option>Hold</option><option>Reject</option></select>
        </div>
        <div class="col-12"><label class="form-label">Feedback Notes</label><textarea class="form-control" id="fbNotes" rows="3"></textarea></div>
        <div class="col-12"><label class="form-label">Interview Status</label>
          <select class="form-select" id="fbStatus"><option>Completed</option><option>No Show</option><option>Cancelled</option></select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-success" onclick="saveFeedback()">Submit Feedback</button>
      </div>
    </div>
  </div>
</div>

<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
requireAuth(['admin','superadmin']);
populateTopnav();
const STATUS_BADGE = { 'Scheduled':'warning','Completed':'success','Cancelled':'secondary','No Show':'danger' };
let scheduleModal, feedbackModal;

async function populateCandidates() {
  const res = await HrmsApi.listCandidates();
  const sel = document.getElementById('iCandId');
  (res?.data||[]).forEach(c => {
    const o = document.createElement('option');
    o.value = c.id;
    o.textContent = `${c.firstName} ${c.lastName} – ${c.email}`;
    sel.appendChild(o);
  });
  const urlCand = new URLSearchParams(location.search).get('candidateId');
  if (urlCand) { sel.value = urlCand; loadInterviews(); }
}

function openScheduleModal() { document.getElementById('iScheduledAt').value=''; scheduleModal.show(); }

async function scheduleInterview() {
  const dto = {
    candidateId:      parseInt(document.getElementById('iCandId').value),
    jobRequisitionId: null,
    scheduledAt:      document.getElementById('iScheduledAt').value,
    interviewType:    document.getElementById('iType').value,
    venue:            document.getElementById('iVenue').value,
    interviewerNames: document.getElementById('iInterviewers').value,
  };
  if (!dto.candidateId || !dto.scheduledAt) { alert('Please fill required fields.'); return; }
  const res = await HrmsApi.scheduleInterview(dto);
  if (res && res.success) { scheduleModal.hide(); loadInterviews(); }
  else alert((res && res.message) || 'Failed.');
}

function openFeedbackModal(id) {
  document.getElementById('fbItvId').value = id;
  document.getElementById('fbScore').value = '';
  document.getElementById('fbNotes').value = '';
  feedbackModal.show();
}

async function saveFeedback() {
  const id  = document.getElementById('fbItvId').value;
  const dto = {
    feedbackScore: parseInt(document.getElementById('fbScore').value),
    feedbackNotes: document.getElementById('fbNotes').value,
    recommendation: document.getElementById('fbRec').value,
    status: document.getElementById('fbStatus').value,
  };
  const res = await HrmsApi.submitInterviewFeedback(id, dto);
  if (res && res.success) { feedbackModal.hide(); loadInterviews(); }
  else alert((res && res.message) || 'Failed.');
}

async function deleteInterview(id) {
  if (!confirm('Delete this interview?')) return;
  const res = await HrmsApi.deleteInterview(id);
  if (res && res.success) loadInterviews();
}

async function loadInterviews() {
  const tbody = document.getElementById('itvTbody');
  tbody.innerHTML = '<tr><td colspan="9" class="text-center py-3"><span class="spinner-border spinner-border-sm me-2"></span>Loading…</td></tr>';
  const res = await HrmsApi.listInterviews();
  if (!res || !res.success || !res.data.length) {
    tbody.innerHTML = '<tr><td colspan="9" class="text-center py-3 text-muted">No interviews found.</td></tr>'; return;
  }
  tbody.innerHTML = res.data.map(i => `<tr>
    <td><strong>${i.candidateName||'—'}</strong></td>
    <td><span class="badge bg-secondary">${i.interviewType}</span></td>
    <td>${new Date(i.scheduledAt).toLocaleString()}</td>
    <td>${i.venue||'—'}</td>
    <td class="small">${i.interviewerNames||'—'}</td>
    <td>${i.feedbackScore ? i.feedbackScore+'/10' : '—'}</td>
    <td>${i.recommendation ? '<span class="badge bg-info text-dark">'+i.recommendation+'</span>' : '—'}</td>
    <td><span class="badge bg-${STATUS_BADGE[i.status]||'secondary'} text-dark">${i.status}</span></td>
    <td class="text-nowrap">
      ${i.status==='Scheduled'?`<button class="btn btn-xs btn-outline-success py-0 px-1 me-1" onclick="openFeedbackModal(${i.id})"><i class="bi bi-chat-text"></i></button>`:''}
      <button class="btn btn-xs btn-outline-danger py-0 px-1" onclick="deleteInterview(${i.id})"><i class="bi bi-trash"></i></button>
    </td>
  </tr>`).join('');
}

scheduleModal = new bootstrap.Modal(document.getElementById('scheduleModal'));
feedbackModal = new bootstrap.Modal(document.getElementById('feedbackModal'));
populateCandidates().then(() => loadInterviews());
</script>
</body>
</html>
