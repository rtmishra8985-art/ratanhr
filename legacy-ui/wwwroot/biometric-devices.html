<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <title>Biometric Devices – RatanHR</title>
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/hrms.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/theme.css">
  <script src="/js/theme.js"></script>
</head>
<body>

<nav class="sidebar" id="sidebar">
  <div class="brand"><img src="assets/img/ratanhr-logo.png" alt="RatanHR" class="brand-logo"> RatanHR</div>
  <div class="mt-2">
    <div class="nav-label">Main</div>
    <a href="admin-dashboard.html" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <div class="nav-label">Biometric</div>
    <a class="nav-link" href="biometric-dashboard.html"><i class="bi bi-fingerprint"></i> Biometric Dashboard</a>
    <a class="nav-link active" href="biometric-devices.html"><i class="bi bi-hdd-network"></i> Devices</a>
    <a class="nav-link" href="biometric-logs.html"><i class="bi bi-list-ul"></i> Punch Logs</a>
    <a class="nav-link" href="biometric-realtime.html"><i class="bi bi-broadcast"></i> Realtime Monitor</a>
    <a class="nav-link" href="biometric-sync-history.html"><i class="bi bi-arrow-repeat"></i> Sync History</a>
    <a class="nav-link" href="biometric-settings.html"><i class="bi bi-gear"></i> Settings</a>
  </div>
  <button id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme">🌙</button>
</nav>

<nav class="topnav">
  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-sm d-md-none" onclick="document.getElementById('sidebar').classList.toggle('show')"><i class="bi bi-list fs-5"></i></button>
    <h6 class="mb-0 fw-semibold">Biometric Devices</h6>
  </div>
  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addDeviceModal">
      <i class="bi bi-plus-circle me-1"></i> Add Device
    </button>
    <button class="btn btn-sm btn-danger px-3" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="main-panel">
  <div class="card mb-4">
    <div class="card-header fw-semibold"><i class="bi bi-hdd-network me-2"></i>Registered Biometric Devices</div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th>Name</th><th>Vendor</th><th>IP / Port</th><th>Location</th>
              <th>Status</th><th>Enabled</th><th>Last Sync</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="devicesBody">
            <tr><td colspan="8" class="text-center py-4 text-muted">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Add Device Modal -->
<div class="modal fade" id="addDeviceModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add Biometric Device</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="addDeviceForm">
          <div class="mb-3">
            <label class="form-label fw-semibold">Device Name *</label>
            <input type="text" class="form-control" id="newName" placeholder="Main Gate Reader" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Vendor *</label>
            <select class="form-select" id="newVendor" required>
              <option value="">Select vendor…</option>
              <option value="1">ZKTeco</option>
              <option value="2">ESSL</option>
              <option value="3">Matrix</option>
              <option value="4">Suprema</option>
              <option value="5">Hikvision</option>
              <option value="6">Anviz</option>
              <option value="7">Realtime</option>
            </select>
          </div>
          <div class="row g-2 mb-3">
            <div class="col-8">
              <label class="form-label fw-semibold">IP Address *</label>
              <input type="text" class="form-control" id="newIp" placeholder="192.168.1.100" required>
            </div>
            <div class="col-4">
              <label class="form-label fw-semibold">Port</label>
              <input type="number" class="form-control" id="newPort" value="4370">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Serial Number</label>
            <input type="text" class="form-control" id="newSerial" placeholder="Optional">
          </div>
          <div class="mb-3">
            <label class="form-label">Location</label>
            <input type="text" class="form-control" id="newLocation" placeholder="Ground Floor – Entrance">
          </div>
        </form>
        <div id="addDeviceAlert" class="d-none"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="addDevice()">
          <i class="bi bi-plus-circle me-1"></i> Add Device
        </button>
      </div>
    </div>
  </div>
</div>

<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
async function loadDevices() {
  const r = await fetch('/api/biometric/devices', { credentials: 'include' });
  const d = await r.json();
  const tbody = document.getElementById('devicesBody');
  if (!d.success || !d.data?.length) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">No devices registered yet.</td></tr>';
    return;
  }
  tbody.innerHTML = d.data.map(dev => `
    <tr>
      <td class="fw-semibold">${dev.name}</td>
      <td><span class="badge bg-secondary">${dev.vendorName}</span></td>
      <td><code>${dev.ipAddress}:${dev.port}</code></td>
      <td>${dev.location || '–'}</td>
      <td>${statusBadge(dev.status)}</td>
      <td>${dev.isEnabled ? '<span class="badge bg-success">Yes</span>' : '<span class="badge bg-warning text-dark">No</span>'}</td>
      <td class="small text-muted">${dev.lastSyncAt ? new Date(dev.lastSyncAt).toLocaleString() : 'Never'}</td>
      <td>
        <button class="btn btn-xs btn-outline-info btn-sm py-0 px-2 me-1" onclick="testDevice(${dev.id})">
          <i class="bi bi-wifi"></i> Test
        </button>
        ${dev.isEnabled
          ? `<button class="btn btn-xs btn-outline-warning btn-sm py-0 px-2 me-1" onclick="toggleDevice(${dev.id}, false)">Disable</button>`
          : `<button class="btn btn-xs btn-outline-success btn-sm py-0 px-2 me-1" onclick="toggleDevice(${dev.id}, true)">Enable</button>`}
        <button class="btn btn-xs btn-outline-danger btn-sm py-0 px-2" onclick="deleteDevice(${dev.id}, '${dev.name}')">
          <i class="bi bi-trash"></i>
        </button>
      </td>
    </tr>`).join('');
}

function statusBadge(s) {
  const map = {1:'success',2:'secondary',3:'warning',4:'danger',5:'danger'};
  const name = {1:'Active',2:'Inactive',3:'Disabled',4:'Unreachable',5:'Error'};
  return `<span class="badge bg-${map[s]||'secondary'}">${name[s]||s}</span>`;
}

async function addDevice() {
  const body = {
    name: document.getElementById('newName').value.trim(),
    providerType: parseInt(document.getElementById('newVendor').value),
    ipAddress: document.getElementById('newIp').value.trim(),
    port: parseInt(document.getElementById('newPort').value) || 4370,
    serialNumber: document.getElementById('newSerial').value.trim() || null,
    location: document.getElementById('newLocation').value.trim() || null,
  };
  if (!body.name || !body.providerType || !body.ipAddress) {
    showAlert('addDeviceAlert', 'danger', 'Name, vendor and IP address are required.');
    return;
  }
  const r = await fetch('/api/biometric/devices', {
    method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const d = await r.json();
  if (d.success) {
    bootstrap.Modal.getInstance(document.getElementById('addDeviceModal')).hide();
    loadDevices();
  } else {
    showAlert('addDeviceAlert', 'danger', d.message || 'Failed to add device.');
  }
}

async function testDevice(id) {
  const btn = event.currentTarget;
  btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
  const r = await fetch(`/api/biometric/devices/${id}/test`, { method: 'POST', credentials: 'include' });
  const d = await r.json();
  btn.disabled = false; btn.innerHTML = '<i class="bi bi-wifi"></i> Test';
  if (d.success) {
    const s = d.data;
    alert(`${s.deviceName} (${s.vendorName})\nStatus: ${s.isOnline ? 'ONLINE' : 'OFFLINE'}\nFirmware: ${s.firmwareVersion||'N/A'}\nEnrolled: ${s.enrolledUserCount??'N/A'}\n${s.lastError||''}`);
    loadDevices();
  } else {
    alert('Test failed: ' + (d.message || 'Unknown error'));
  }
}

async function toggleDevice(id, enable) {
  const action = enable ? 'enable' : 'disable';
  const r = await fetch(`/api/biometric/devices/${id}/${action}`, { method: 'POST', credentials: 'include' });
  const d = await r.json();
  if (d.success) loadDevices();
  else alert(d.message || 'Action failed.');
}

async function deleteDevice(id, name) {
  if (!confirm(`Delete device "${name}"? This also deletes all punch logs for this device.`)) return;
  const r = await fetch(`/api/biometric/devices/${id}`, { method: 'DELETE', credentials: 'include' });
  const d = await r.json();
  if (d.success) loadDevices();
  else alert(d.message || 'Delete failed.');
}

function showAlert(id, type, msg) {
  const el = document.getElementById(id);
  el.className = `alert alert-${type}`;
  el.textContent = msg;
}

const u = JSON.parse(localStorage.getItem('user') || '{}');

loadDevices();
</script>
</body>
</html>
