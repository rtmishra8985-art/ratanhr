<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <title>Reset Password – RatanHR</title>
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/hrms.css" rel="stylesheet">

  <!-- Theme system -->
  <link rel="stylesheet" href="/css/theme.css">
  <script src="/js/theme.js"></script>
</head>
<body>
<div class="login-wrapper">
  <div class="login-card card">
    <div class="card-body">
      <div class="text-center mb-4">
        <div class="mb-3" style="font-size:48px;">🔒</div>
        <h4 class="fw-bold">Reset Password</h4>
        <p class="text-muted small">Enter the reset token you were given, and choose a new password.</p>
      </div>

      <div id="alertBox" class="alert d-none py-2 small"></div>

      <form id="resetForm">
        <div class="mb-3">
          <label class="form-label fw-semibold small">Reset Token</label>
          <input type="text" class="form-control" id="token" placeholder="Paste the token from your reset email" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold small">New Password</label>
          <input type="password" class="form-control" id="newPassword" placeholder="Enter new password" required minlength="8">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold small">Confirm Password</label>
          <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm new password" required minlength="8">
        </div>
        <div class="d-grid mb-3">
          <button type="submit" class="btn btn-login btn-lg" id="submitBtn">RESET PASSWORD</button>
        </div>
        <div class="text-center">
          <a href="login.html" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left"></i> Back to Login</a>
        </div>
      </form>
    </div>
  </div>
</div>
<script>
  // Support arriving via a link like reset-password.html?token=...
  const params = new URLSearchParams(window.location.search);
  const prefillToken = params.get('token');
  if (prefillToken) document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('token').value = prefillToken;
  });

  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const box = document.getElementById('alertBox');
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    if (newPassword !== confirmPassword) {
      box.className = 'alert alert-danger py-2 small';
      box.textContent = 'Passwords do not match.';
      return;
    }
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    try {
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: document.getElementById('token').value.trim(), newPassword, confirmPassword })
      });
      const data = await res.json();
      if (data.success) {
        box.className = 'alert alert-success py-2 small';
        box.textContent = 'Password reset successfully. Redirecting to login…';
        setTimeout(() => window.location.href = 'login.html', 1500);
      } else {
        box.className = 'alert alert-danger py-2 small';
        box.textContent = data.message || 'Invalid or expired reset token.';
      }
    } catch {
      box.className = 'alert alert-danger py-2 small';
      box.textContent = 'Cannot connect to server. Please try again.';
    } finally {
      btn.disabled = false;
    }
  });
</script>
<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
