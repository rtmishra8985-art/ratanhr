global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    environment: production
    project: hrms

# ── Alert rules ─────────────────────────────────────────────────────────────
rule_files:
  - /etc/prometheus/alerts.yml

# ── Alertmanager ─────────────────────────────────────────────────────────────
# FIX 10: Alertmanager service is now active in docker-compose.yml.
# Routes and receiver configuration live in monitoring/alertmanager.yml.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# ── Scrape configs ───────────────────────────────────────────────────────────
scrape_configs:

  # ── HRMS API ────────────────────────────────────────────────────────────
  - job_name: hrms-api
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['api:8080']
        labels:
          service: hrms-api
          environment: production

  # ── MySQL (requires mysqld_exporter sidecar) ─────────────────────────────
  # Deploy: docker run -e DATA_SOURCE_NAME="hrms:<MYSQL_PASSWORD>@(mysql:3306)/" prom/mysqld-exporter
  - job_name: mysql
    scrape_interval: 30s
    static_configs:
      - targets: ['mysql-exporter:9104']
        labels:
          service: mysql
          environment: production

  # ── Redis (requires redis_exporter sidecar) ──────────────────────────────
  # Deploy: docker run -e REDIS_ADDR="redis:6379" oliver006/redis_exporter
  - job_name: redis
    scrape_interval: 30s
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: redis
          environment: production

  # ── Node / host metrics (requires node_exporter) ─────────────────────────
  - job_name: node
    scrape_interval: 30s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: node
          environment: production

  # ── Prometheus self-monitoring ────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
