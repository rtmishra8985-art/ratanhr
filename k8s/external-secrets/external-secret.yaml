# ExternalSecret — pulls secrets from the remote store and materialises them
# as the Kubernetes Secret named `hrms-secrets`.
# Apply AFTER installing ESO and creating the ClusterSecretStore.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hrms-external-secret
  namespace: hrms
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hrms-secret-store
    kind: ClusterSecretStore
  target:
    name: hrms-secrets
    creationPolicy: Owner
  data:
    - secretKey: ConnectionStrings__DefaultConnection
      remoteRef:
        key: hrms/production/db
        property: connection_string
    # FIX: RS256 asymmetric keys replace the old HS256 Jwt__Key.
    # Store the full PEM strings (with newlines) in your secret manager at these paths.
    - secretKey: Jwt__PrivateKeyPem
      remoteRef:
        key: hrms/production/jwt
        property: private_key_pem
    - secretKey: Jwt__PublicKeyPem
      remoteRef:
        key: hrms/production/jwt
        property: public_key_pem
    - secretKey: Security__EncryptionKey
      remoteRef:
        key: hrms/production/security
        property: encryption_key
    - secretKey: Redis__ConnectionString
      remoteRef:
        key: hrms/production/redis
        property: connection_string
    - secretKey: Email__Host
      remoteRef:
        key: hrms/production/smtp
        property: host
    - secretKey: Email__Username
      remoteRef:
        key: hrms/production/smtp
        property: username
    - secretKey: Email__Password
      remoteRef:
        key: hrms/production/smtp
        property: password
    - secretKey: Email__FromAddress
      remoteRef:
        key: hrms/production/smtp
        property: from_address
    # Phase 7: Replaced PostgreSQL secret keys with MySQL equivalents.
    - secretKey: MYSQL_DATABASE
      remoteRef:
        key: hrms/production/db
        property: name
    - secretKey: MYSQL_USER
      remoteRef:
        key: hrms/production/db
        property: username
    - secretKey: MYSQL_PASSWORD
      remoteRef:
        key: hrms/production/db
        property: password
    - secretKey: MYSQL_ROOT_PASSWORD
      remoteRef:
        key: hrms/production/db
        property: root_password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: hrms/production/redis
        property: password
    - secretKey: Cors__AllowedOrigins
      remoteRef:
        key: hrms/production/cors
        property: allowed_origins
