# ClusterSecretStore — connects External Secrets Operator to your secrets backend.
# Replace the `provider` block with your chosen provider:
#   AWS Secrets Manager (shown below), HashiCorp Vault, GCP Secret Manager,
#   Azure Key Vault, Doppler, etc.
# Docs: https://external-secrets.io/latest/provider/
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: hrms-secret-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1          # ← set your AWS region
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
