apiVersion: v1
kind: Service
metadata:
  name: redis-svc
  namespace: hrms
  labels:
    app.kubernetes.io/name: hrms
    app.kubernetes.io/component: redis
spec:
  clusterIP: None   # Headless — API connects by pod DNS
  selector:
    app: hrms-redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
---
apiVersion: apps/v1
kind: StatefulSet   # FIX BLOCKER-1: Changed from Deployment to StatefulSet so the PVC
                    # binding survives pod restarts. A plain Deployment cannot guarantee
                    # stable PVC attachment across rescheduling events.
metadata:
  name: hrms-redis
  namespace: hrms
  labels:
    app.kubernetes.io/name: hrms
    app.kubernetes.io/component: redis
spec:
  serviceName: redis-svc
  replicas: 1
  selector:
    matchLabels:
      app: hrms-redis
  template:
    metadata:
      labels:
        app: hrms-redis
        app.kubernetes.io/name: hrms
        app.kubernetes.io/component: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4-alpine@sha256:b1addbe72465a718643cff9e60a58e6df1841e29d6d7d60c9a85d8d72f08d1a7
          command:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - allkeys-lru
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec        # AOF sync every second — durability vs. throughput balance
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "-a", "$(REDIS_PASSWORD)", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "-a", "$(REDIS_PASSWORD)", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: redis-data
              mountPath: /data   # FIX BLOCKER-1: PVC mount — data persists across restarts
  # FIX BLOCKER-1: volumeClaimTemplates binds the PVC defined in redis-pvc.yaml.
  # The PVC name must match the `claimName` below. On pod restart the StatefulSet
  # reattaches the same PVC so AOF data (Hangfire jobs, rate-limit counters) survives.
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard   # ← match your cloud provider: gp3 / standard / managed-premium
        resources:
          requests:
            storage: 5Gi
