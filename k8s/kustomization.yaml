# Apply everything in dependency order:
#   kubectl apply -k k8s/
#
# First-time setup sequence:
#   1. kubectl apply -f k8s/namespace.yaml
#   2. Install/configure the External Secrets Operator resources below.
#      (or let External Secrets Operator create it via external-secrets/)
#   3. kubectl apply -f k8s/configmap.yaml
#   4. kubectl apply -f k8s/mysql-statefulset.yaml
#   5. kubectl apply -f k8s/redis-pvc.yaml      # FIX BLOCKER-1: create PVC before StatefulSet
#   6. kubectl apply -f k8s/redis-deployment.yaml
#   7. kubectl apply -f k8s/migrate-job.yaml
#   8. kubectl wait --for=condition=complete job/hrms-migrate -n hrms --timeout=120s
#   9. kubectl apply -f k8s/api-deployment.yaml
#  10. kubectl apply -f k8s/ingress.yaml
#  11. kubectl apply -f k8s/hpa.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hrms

resources:
  - namespace.yaml
  - configmap.yaml
  - mysql-statefulset.yaml
  - redis-deployment.yaml
  - migrate-job.yaml
  - api-deployment.yaml
  - backup-cronjob.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - ingress.yaml
  - hpa.yaml
  # Secrets are materialised by External Secrets Operator. No credentials are
  # stored in this repository or generated by the base kustomization.
  - external-secrets/external-secret.yaml
